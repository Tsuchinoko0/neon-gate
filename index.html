<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>NEON GATE</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DotGothic16&family=M+PLUS+1+Code:wght@400;600&display=swap">
<style>
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0}
img{max-width:100%}
/* Layout: 上に状態バー、中央に16:9のドット絵画面（会話・スキャンは画面の上に重ねる）、下に操作ボタン。夜の街の単一ダークテーマ */
:root{
  --void:#07060d; --panel:#110e20; --panel2:#1a1530; --line:#2e2750;
  --ink:#ebe6ff; --muted:#948cbb; --pink:#ff3d8b; --cyan:#3ef2e0; --amber:#ffb547; --red:#ff4a5c;
  --f-dot:"DotGothic16","M PLUS 1 Code",monospace;
  --f-data:"M PLUS 1 Code","SFMono-Regular",Consolas,monospace;
  color-scheme:dark;
}
[hidden]{display:none!important}
*{box-sizing:border-box}
html,body{background:var(--void);color:var(--ink)}
body{font-family:var(--f-dot);font-size:15px;line-height:1.6;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px 32px}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--cyan);outline-offset:2px}
.wrap{max-width:960px;margin:0 auto;display:flex;flex-direction:column;gap:10px}
.head{display:flex;flex-wrap:wrap;align-items:baseline;justify-content:space-between;gap:4px 16px}
.head h1{margin:0;font-weight:400;font-size:clamp(24px,5vw,34px);letter-spacing:.08em;color:var(--ink);text-shadow:0 0 12px rgba(255,61,139,.55)}
.eyebrow{font-family:var(--f-data);font-size:11px;letter-spacing:.16em;color:var(--muted)}

.bar{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-family:var(--f-data);font-size:12px}
.chip{border:1px solid var(--line);background:var(--panel);padding:3px 9px;border-radius:2px;white-space:nowrap;font-variant-numeric:tabular-nums}
.chip.area{color:var(--amber);border-color:rgba(255,181,71,.35)}
.chip.spec{color:var(--cyan);border-color:rgba(62,242,224,.35)}
.chip.cr{color:var(--pink);border-color:rgba(255,61,139,.35)}
.chip.body{display:inline-flex;align-items:center;gap:6px}
.chip.body .f{color:var(--amber)} .chip.body .m{color:var(--cyan)}
.gauge{display:inline-flex;width:72px;height:6px;background:#0b2a2a;border:1px solid var(--line)}
.gauge b{display:block;height:100%;background:var(--amber);transition:width .4s}
.gauge i{display:block;height:100%;flex:1;background:repeating-linear-gradient(90deg,var(--cyan) 0 3px,#1a9e94 3px 4px)}
.bar .sp{flex:1}
.bar{position:relative}
.sndpop{position:absolute;right:0;top:calc(100% + 6px);z-index:20;width:min(340px,100%);background:var(--panel);border:1px solid var(--line);border-top:2px solid var(--cyan);padding:12px 14px;display:grid;gap:10px;box-shadow:0 8px 24px rgba(0,0,0,.5)}
.sndpop .vol{flex-direction:column;align-items:stretch}
.sndpop .vol label{display:grid;grid-template-columns:4.5em minmax(0,1fr) 3.2em}
.sndpop .vol input{width:100%}
.vol output{min-width:3.2em;text-align:right;color:var(--cyan);font-variant-numeric:tabular-nums}
.tbtn{white-space:nowrap;background:var(--panel);border:1px solid var(--line);padding:4px 12px;border-radius:2px;font-family:var(--f-data);font-size:12px}
.tbtn:hover{border-color:var(--cyan)}

.frame{position:relative;width:100%;aspect-ratio:var(--ar,16/9);background:#000;border:1px solid var(--line);overflow:hidden;max-width:100%}
.frame.is-panel{aspect-ratio:auto;min-height:440px;background:var(--panel)}
#cv{display:block;width:100%;height:100%;image-rendering:pixelated;image-rendering:crisp-edges;touch-action:manipulation}

/* タイトル */
.title{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:clamp(6px,2vw,14px);background:linear-gradient(transparent 30%,rgba(7,6,13,.75));text-align:center;padding:12px}
.title h2{margin:0;font-weight:400;font-size:clamp(30px,9vw,76px);letter-spacing:.12em;line-height:1;color:#fff;text-shadow:0 0 6px var(--pink),0 0 22px var(--pink),3px 0 0 rgba(62,242,224,.6)}
.title p{margin:0;font-size:clamp(11px,2vw,15px);color:var(--muted)}
.title .row{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
.nbtn{background:transparent;border:1px solid var(--cyan);color:var(--cyan);padding:6px 18px;border-radius:2px;font-size:clamp(12px,2vw,16px);letter-spacing:.06em}
.nbtn:hover,.nbtn.sel{background:var(--cyan);color:var(--void)}
.nbtn.pink{border-color:var(--pink);color:var(--pink)}
.nbtn.pink:hover{background:var(--pink);color:var(--void)}
.nbtn.ghost{border-color:var(--line);color:var(--muted)}

/* 会話 */
.dlg{position:absolute;left:3%;right:3%;bottom:4%;background:rgba(9,7,20,.93);border:1px solid var(--line);border-left:3px solid var(--cyan);padding:clamp(6px,1.4vw,12px) clamp(10px,2vw,16px);font-size:clamp(12px,2.1vw,18px);line-height:1.55;cursor:pointer;min-height:28%}
.dlg .who{font-size:.78em;color:var(--cyan);letter-spacing:.1em}
.dlg.npc-doc{border-left-color:var(--red)} .dlg.npc-doc .who{color:var(--red)}
.dlg.npc-mina{border-left-color:var(--pink)} .dlg.npc-mina .who{color:var(--pink)}
.dlg.npc-gate{border-left-color:var(--amber)} .dlg.npc-gate .who{color:var(--amber)}
.dlg.npc-genji{border-left-color:var(--amber)} .dlg.npc-genji .who{color:var(--amber)}
.dlg.npc-ray{border-left-color:#c9d2e6} .dlg.npc-ray .who{color:#c9d2e6}
.dlg.npc-daimon{border-left-color:#e8a040} .dlg.npc-daimon .who{color:#e8a040}
.dlg.npc-tsugi{border-left-color:#5fb8ff} .dlg.npc-tsugi .who{color:#5fb8ff}
.dlg.npc-kago{border-left-color:var(--muted)} .dlg.npc-kago .who{color:var(--muted)}
.tags{position:absolute;inset:0;pointer-events:none;overflow:hidden}
.tags span{position:absolute;transform:translate(-50%,-100%);font-family:var(--f-data);font-size:clamp(8px,1.3vw,11px);line-height:1.3;color:var(--cyan);background:rgba(4,10,14,.72);border:1px solid rgba(62,242,224,.5);padding:0 4px;white-space:nowrap}
/* 話せない住人のタグ：小さく、薄く */
.tags span.sub{font-size:clamp(7px,1.05vw,9px);color:rgba(62,242,224,.75);background:rgba(4,10,14,.5);border-color:rgba(62,242,224,.25)}
/* 仕事・スキャン・設定などの画面を開いているあいだは、タグを出さない */
.frame.is-panel .tags{display:none}
.fade{position:absolute;inset:0;background:#000;opacity:0;pointer-events:none;transition:opacity .35s}
.fade.on{opacity:1}
.floors{display:grid;gap:8px;max-width:420px}
.floors .nbtn{text-align:left;display:flex;justify-content:space-between;gap:12px}
.lift-ind{font-family:var(--f-data);font-size:clamp(36px,9vw,60px);color:var(--amber);text-align:center;letter-spacing:.1em;text-shadow:0 0 14px rgba(255,181,71,.5);padding-block:30px}
.dlg.npc-me{border-left-color:var(--muted)} .dlg.npc-me .who{color:var(--muted)}
/* 本音：金色の縁と文字。ふだんの会話と見分けがつくように */
.endrec{font-family:var(--f-data);font-size:12px;color:var(--muted);margin:8px 0 0;line-height:1.6}
.dlg.top{top:4%;bottom:auto}
.dlg.out{position:relative;left:auto;right:auto;bottom:auto;min-height:104px}
.dlg.honne{border:1px solid rgba(201,160,255,.7);border-left:4px solid #ffd27a;background:rgba(28,16,38,.96);box-shadow:0 0 22px rgba(201,160,255,.35),inset 0 0 30px rgba(255,210,122,.06)}
.dlg.honne .who{color:#ffd27a}
.dlg.honne .who::after{content:'　本音';color:#c9a0ff;letter-spacing:.2em}
.dlg.honne .txt{color:#ffe7b0}
.dlg.honne .more{color:#ffd27a}
.tbtn.new{border-color:var(--amber);color:var(--amber);box-shadow:0 0 10px rgba(255,181,71,.5)}
.goal{border:1px solid var(--line);border-left:3px solid var(--amber);padding:10px 14px;background:var(--panel2)}
.goal b{color:var(--amber)}
.conds{display:grid;gap:6px}
.cond{display:grid;grid-template-columns:22px minmax(0,1fr);gap:4px 8px;align-items:baseline;font-size:14px}
.cond .ok{color:var(--cyan)} .cond .ng{color:var(--red)} .cond .lock{color:var(--muted)}
.cond .ex{grid-column:2;font-size:12px;color:var(--muted);font-family:var(--f-data)}
.story{margin:0;padding-left:1.2em;display:grid;gap:4px;font-size:14px;color:var(--ink)}
.dlg .txt{min-height:2.6em}
.dlg .more{position:absolute;right:12px;bottom:6px;color:var(--cyan);animation:blink 1s steps(2) infinite}
.dlg .ch{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.dlg .ch .nbtn{font-size:clamp(11px,1.9vw,15px);padding:3px 12px}
@keyframes blink{50%{opacity:0}}

.toast.low{top:auto;bottom:6%}
.toast{position:absolute;left:50%;top:5%;transform:translateX(-50%);background:rgba(9,7,20,.94);border:1px solid var(--amber);color:var(--amber);padding:6px 14px;font-size:clamp(11px,1.9vw,15px);max-width:90%;text-align:center}

/* パネル（スキャン・結果・設定） */
.panel{padding:clamp(14px,3vw,26px);display:flex;flex-direction:column;gap:14px;min-height:440px}
.panel h3{margin:0;font-weight:400;font-size:clamp(20px,4vw,28px)}
.panel p{margin:0;max-width:62ch}
.panel .muted{color:var(--muted)}
.mono{font-family:var(--f-data);font-variant-numeric:tabular-nums}
.prow{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.plist{margin:0;padding:0;list-style:none;display:grid;gap:6px}
.plist li{display:grid;grid-template-columns:52px 1fr;gap:10px;align-items:baseline}
.tag{font-family:var(--f-data);font-weight:600;font-size:12px;color:var(--cyan);letter-spacing:.08em}
.hud{display:flex;justify-content:space-between;font-family:var(--f-data);font-size:13px;color:var(--muted)}
.timer{height:4px;background:var(--panel2)}
.timer i{display:block;height:100%;background:var(--amber);width:100%}
.pad{flex:1;min-height:240px;border:1px solid var(--line);display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:22px;user-select:none;-webkit-user-select:none;touch-action:manipulation}
.pad small{font-size:13px;opacity:.85}
.pad.wait{background:var(--panel2);color:var(--muted)}
.pad.go{background:var(--cyan);color:var(--void)}
.pad.early{background:var(--red);color:#fff}
.digits{font-family:var(--f-data);font-size:clamp(30px,8vw,52px);letter-spacing:.18em;text-align:center;padding-block:44px;font-weight:600;word-break:break-all;color:var(--cyan);text-shadow:0 0 12px rgba(62,242,224,.5)}
.ans{font-family:var(--f-data);font-size:22px;padding:8px 12px;border:1px solid var(--line);background:var(--void);color:var(--ink);width:100%;max-width:300px;letter-spacing:.08em;border-radius:2px}
.q{font-family:var(--f-data);font-size:clamp(30px,7vw,44px);font-weight:600;text-align:center;padding-block:24px 8px}
.grid{display:grid;gap:5px;width:100%;max-width:340px;aspect-ratio:1;margin:0 auto}
.grid button{border:0;padding:0;border-radius:1px}
.flash{animation:fl .25s}
@keyframes fl{50%{transform:translateX(6px)}}
.note{font-size:12px;color:var(--muted);margin:0;font-family:var(--f-data)}

/* 仕事 */
.jobs{display:grid}
.job{display:grid;grid-template-columns:44px minmax(0,1fr) auto;gap:0 12px;align-items:center;padding-block:10px;border-top:1px solid var(--line)}
.job .nm{font-size:17px}
.job .ex{grid-column:2;font-size:12px;color:var(--muted);font-family:var(--f-data)}
.job .nbtn{grid-column:3;grid-row:1/3}
.job .act{grid-column:3;grid-row:1/3;display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.nbtn:disabled,.nbtn:disabled:hover{opacity:.45;cursor:default;background:transparent;color:var(--muted);border-color:var(--line)}
.mcv{display:block;width:100%;max-width:640px;margin:0 auto;aspect-ratio:200/112;image-rendering:pixelated;image-rendering:crisp-edges;border:1px solid var(--line);background:#000;touch-action:none}
.panel .c{max-width:none;text-align:center}
.status{font-family:var(--f-data);color:var(--amber);min-height:1.6em}
.frame.is-panel~.ctrl{visibility:hidden}
.keypad{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;width:100%;max-width:300px;margin:0 auto}
.keypad button{aspect-ratio:1.4;background:var(--panel2);border:1px solid var(--line);font-family:var(--f-data);font-size:24px;font-weight:600;color:var(--muted);border-radius:2px;touch-action:manipulation}
.keypad button.lit{background:var(--cyan);border-color:var(--cyan);color:var(--void);box-shadow:0 0 18px rgba(62,242,224,.6)}
.keypad button.hit{color:var(--cyan);border-color:var(--cyan)}
.keypad button.bad{background:var(--red);border-color:var(--red);color:#fff}
.target{display:flex;align-items:center;justify-content:center;gap:12px;font-family:var(--f-data);font-size:13px;color:var(--muted)}
.target i{display:block;width:48px;height:28px;border:2px solid var(--ink)}
.feeds{display:grid;gap:4px;width:100%;max-width:360px;margin:0 auto}
.feeds button{aspect-ratio:1;padding:0;border:1px solid #1d1a33;border-radius:1px;background:#0d0b18 repeating-linear-gradient(0deg,rgba(255,255,255,.04) 0 1px,transparent 1px 3px);display:flex;align-items:center;justify-content:center}
.feeds img{height:78%;image-rendering:pixelated;image-rendering:crisp-edges;pointer-events:none}
.tum{display:flex;gap:8px;justify-content:center;align-items:center;font-family:var(--f-data);font-size:13px;color:var(--muted)}
.tum i{display:block;width:14px;height:22px;border:1px solid var(--line);background:var(--panel2)}
.tum i.on{background:var(--cyan);border-color:var(--cyan)}
.feeds button.glow{box-shadow:inset 0 0 0 2px var(--cyan),0 0 16px rgba(62,242,224,.75)}
.pips{font-family:var(--f-data);font-size:12px;color:var(--cyan);letter-spacing:.1em;margin-left:8px}
.vol{display:flex;flex-wrap:wrap;gap:10px 18px;align-items:center;font-family:var(--f-data);font-size:13px}
.vol label{display:flex;align-items:center;gap:8px}
.vol input{accent-color:var(--cyan);width:140px}
.track{position:relative;height:34px;border:1px solid var(--line);background:var(--panel2);max-width:520px;width:100%;margin:0 auto}
.track .zone{position:absolute;top:0;bottom:0;background:rgba(62,242,224,.28);border-left:1px solid var(--cyan);border-right:1px solid var(--cyan)}
.track .mark{position:absolute;top:-4px;bottom:-4px;width:4px;margin-left:-2px;background:var(--amber);box-shadow:0 0 10px rgba(255,181,71,.7)}
.track.hit{box-shadow:0 0 0 2px var(--cyan)} .track.miss{box-shadow:0 0 0 2px var(--red)}
.seq{display:flex;gap:6px;justify-content:center;min-height:52px;flex-wrap:wrap}
.seq span{width:44px;height:44px;display:flex;align-items:center;justify-content:center;font-size:24px;border:1px solid var(--line);background:var(--panel2)}
.minutes{min-height:46px;display:grid;place-items:center;font-family:var(--f-data);font-size:clamp(18px,4.5vw,26px)}
.mline{display:flex;gap:14px;align-items:baseline}.mline b{font-weight:600}
.qs{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;max-width:440px;width:100%;margin:0 auto}
.idcards{display:flex;gap:14px;justify-content:center;flex-wrap:wrap}
.idc{border:1px solid var(--line);padding:8px;background:var(--panel2);display:grid;gap:6px}
.idg{display:grid;grid-template-columns:repeat(6,1fr);width:min(150px,38vw);aspect-ratio:1;gap:1px}
.idg i,.idg button{display:block;border:0;padding:0;border-radius:0}
.idg button.glow{box-shadow:inset 0 0 0 2px var(--cyan),0 0 12px rgba(62,242,224,.85)}
.ledger{font-family:var(--f-data);max-width:360px;width:100%;margin:0 auto;border:1px solid var(--line);padding:8px 12px;display:grid;gap:4px}
.lrow{display:flex;justify-content:space-between;font-size:15px}.lrow b{font-weight:600}.lrow .neg{color:var(--pink)}.lrow .pos{color:var(--cyan)}
.lrow i{font-style:normal;color:var(--amber)}.lrow.tot{border-top:1px solid var(--line);padding-top:4px;color:var(--amber)}
.syms{display:grid;grid-template-columns:repeat(6,1fr);gap:6px;max-width:420px;width:100%;margin:0 auto}
.syms button{aspect-ratio:1;font-size:26px;background:var(--panel2);border:1px solid var(--line);border-radius:2px}
.belt{position:relative;height:70px;overflow:hidden;border-top:2px solid #3a3438;border-bottom:2px solid #3a3438;background:repeating-linear-gradient(90deg,#1a1618 0 10px,#221d20 10px 12px)}
.belt .row{position:absolute;top:8px;left:0;display:flex;gap:10px;will-change:transform}
.belt button{width:50px;height:50px;border-radius:50%;border:3px solid #0b0a12;padding:0;background:var(--c);box-shadow:inset 0 0 0 6px rgba(0,0,0,.18)}
.belt button::after{content:'';display:block;width:14px;height:14px;margin:auto;border-radius:50%;background:#0b0a12}
.belt button.glow{box-shadow:0 0 0 3px var(--cyan),0 0 16px rgba(62,242,224,.8)}
.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;max-width:360px;width:100%;margin:0 auto}
.tiles button{padding:14px 0;font-family:var(--f-data);font-size:26px;font-weight:600;background:var(--panel2);border:1px solid var(--line);color:var(--ink);border-radius:2px}
.tiles button.on{background:var(--amber);color:var(--void);border-color:var(--amber)}
.earn{font-family:var(--f-data);font-size:clamp(30px,7vw,46px);font-weight:600;color:var(--pink);margin:0;text-shadow:0 0 12px rgba(255,61,139,.45)}

.sheet{display:grid;gap:8px}
.srow{display:grid;grid-template-columns:44px minmax(0,1fr) auto;gap:4px 12px;align-items:center;padding-block:8px;border-top:1px solid var(--line)}
.srow .v{font-family:var(--f-data);font-weight:600;white-space:nowrap}
.srow .ex{grid-column:2/-1;font-size:12px;color:var(--muted);font-family:var(--f-data)}
.meter{grid-column:2/-1;height:6px;background:var(--panel2)}
.meter i{display:block;height:100%;background:var(--cyan)}
.model{font-size:clamp(22px,5vw,34px);margin:0;letter-spacing:.04em;word-break:break-word}
.klass{color:var(--pink);margin:0}
.stats{display:flex;flex-wrap:wrap;gap:8px}
.stat{border:1px solid var(--line);padding:6px 12px;display:grid;gap:0;min-width:120px}
.stat b{font-family:var(--f-data);font-size:20px;font-weight:600}
.stat span{font-size:11px;color:var(--muted);font-family:var(--f-data)}
.seg{display:flex;flex-wrap:wrap;gap:6px}

/* 操作 */
.ctrl{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.keys{display:flex;gap:10px;align-items:center}
.dir{display:flex;gap:10px}
.kbtn{width:64px;height:52px;background:var(--panel);border:1px solid var(--line);font-size:20px;border-radius:2px;user-select:none;-webkit-user-select:none;touch-action:none}
.kbtn.act{width:auto;padding:0 18px;font-size:15px;color:var(--cyan);border-color:rgba(62,242,224,.45)}
.kbtn.run{width:auto;padding:0 14px;font-size:14px;color:var(--muted)}
.kbtn.run[aria-pressed="true"]{color:var(--amber);border-color:rgba(255,181,71,.6)}
.kbtn:active{background:var(--panel2)}
.hint{font-family:var(--f-data);font-size:12px;color:var(--muted)}
.acts{display:flex;gap:8px}.acts[hidden]{display:none}.acts .kbtn{width:56px;font-size:17px}#kF{color:var(--cyan);border-color:rgba(62,242,224,.45)}
.endwrap{display:grid;gap:14px;justify-items:center;padding-block:10px}
.endcv{width:min(100%,540px);aspect-ratio:360/170;image-rendering:pixelated;background:#07060d}
.end-t{font-family:var(--f-data);font-size:clamp(28px,7vw,44px);letter-spacing:.4em;color:var(--ink);margin:0}
@media (max-width:560px){.hint{display:none}}
/* スマホ：上のバーを2段にまとめ、ゲーム画面を広くする */

<script src="sound.js?v=0.28"></script>
<script>
(()=>{
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const clamp=(v,a=0,b=100)=>Math.max(a,Math.min(b,v));

/* ===== 脳スペック（診断サイトと同じ換算） ===== */
const TESTS=[
  {id:'cpu',tag:'CPU',nm:'反応速度',desc:'パッドがシアンに光った瞬間にタップ。5回の平均反応時間を測ります。'},
  {id:'ram',tag:'RAM',nm:'短期記憶',desc:'表示される数字を覚えて入力。桁数が増えていきます。ミスは2回まで。'},
  {id:'gpu',tag:'GPU',nm:'色の識別',desc:'1枚だけ色が違うタイルをタップ。30秒でいくつ見つけられるか。'},
  {id:'alu',tag:'ALU',nm:'暗算',desc:'計算問題に30秒間答え続けます。間違えても次へ進みます。'}
];
const ghz=ms=>800/ms, gb=s=>2**(s-3), tflops=n=>0.3*1.2**n, cores=n=>Math.max(1,Math.round(n*0.8));
function score(id,v){if(v==null)return null;if(id==='cpu')return clamp((450-v)/(450-180)*100);if(id==='ram')return clamp((v-3)/(10-3)*100);return clamp(v/30*100)}
const fmtGB=g=>g<1?Math.round(g*1024)+' MB':g+' GB';
function spec(id,v){
  if(v==null)return{main:'—',raw:'未計測'};
  if(id==='cpu')return{main:ghz(v).toFixed(2)+' GHz',raw:`平均反応 ${Math.round(v)} ms`};
  if(id==='ram')return{main:fmtGB(gb(v)),raw:`記憶スパン ${v} 桁`};
  if(id==='gpu'){const t=tflops(v);return{main:(t<10?t.toFixed(1):Math.round(t))+' TFLOPS',raw:`識別 ${v} 回 / 30秒`}}
  return{main:cores(v)+' コア',raw:`正答 ${v} 問 / 30秒`};
}
const LADDERS={
  cpu:[[v=>v<=190,'最上位デスクトップCPU級'],[v=>v<=220,'ハイエンドCPU級'],[v=>v<=260,'ミドルCPU級'],[v=>v<=320,'エントリーCPU級'],[v=>v<=400,'格安ノートPC級'],[()=>true,'Raspberry Pi 級']],
  ram:[[v=>v>=10,'サーバー級'],[v=>v>=9,'ワークステーション級'],[v=>v>=8,'ハイエンドゲーミングPC級'],[v=>v>=7,'標準的なゲーミングPC級'],[v=>v>=6,'一般的なノートPC級'],[v=>v>=5,'数年前のスマホ級'],[()=>true,'初期のスマホ級']],
  gpu:[[v=>tflops(v)>=105,'RTX 5090 級'],[v=>tflops(v)>=83,'RTX 4090 級'],[v=>tflops(v)>=29,'RTX 4070 級'],[v=>tflops(v)>=10,'PlayStation 5 級'],[v=>tflops(v)>=4,'Xbox Series S 級'],[v=>tflops(v)>=1.8,'PlayStation 4 級'],[v=>tflops(v)>=0.4,'Nintendo Switch 級'],[()=>true,'電卓・ガラケー級']],
  alu:[[v=>cores(v)>=24,'Core i9 級'],[v=>cores(v)>=16,'Ryzen 9 級'],[v=>cores(v)>=8,'Ryzen 7 級'],[v=>cores(v)>=6,'Ryzen 5 級'],[v=>cores(v)>=4,'Core i3 級'],[v=>cores(v)>=2,'Celeron 級'],[()=>true,'初期のパソコン級']]
};
const like=(id,v)=>LADDERS[id].find(r=>r[0](v))[1];
const TIERS=[

];
function overall(d){if(!d||TESTS.some(t=>d[t.id]==null))return null;const avg=TESTS.reduce((s,t)=>s+score(t.id,d[t.id]),0)/4;return{avg,tier:TIERS.find(x=>avg<x.max)}}

const GLOW=0.3;

  {id:'buffer',stat:'ram',job:'pass',nm:'記憶バッファ',desc:'海馬の横に差す小さな外部記憶。見たものをもう一度呼び出せる。',eff:lv=>`仕事（パスコード・工程手順・会議の盗聴）：見直せる回数 +${lv}`,fight:lv=>`敵の攻撃の予兆が早く見える`},
  {id:'optic',stat:'gpu',job:'cam',nm:'光学センサー',desc:'網膜に重ねる色解析レンズ。標的を一瞬だけ光らせる。',eff:lv=>`仕事（監視カメラ・不良品検査・身分証）：標的が ${Math.round(lv*GLOW*10)/10} 秒光る`,fight:lv=>`敵の弱点が光って見え、大きくなる`},

const sumLv=(id,k)=>IMP_LV.slice(0,impLv(id)).reduce((n,x)=>n+x[k],0);
/* 店ごとの値段と性能。層が上がるほど少し高く、少し良い部品（Lv ごとに実効 +plus）。どこで入れたかは S.impQ に記録 */
const SHOPS={corp:{who:'saeki',place:'企業区 正規クリニック',mult:1.5,plus:2,back:'クリニックに戻る',note:'企業の正規品。保証つき。ただし保証は、査定の数字とひもづいている。'},out:{who:'doc',place:'ドク・カゲロウ診療所',mult:1,plus:0,back:'診療所に戻る',note:'部品は、沈殿街のツギハギが改良し終えた型落ちを譲ってもらったもの。'},lower:{who:'tsugi',place:'鋼組の施術所',mult:1.25,plus:1,back:'施術所を出る',note:'上の層から落ちてきた廃棄品を、ツギハギが拾って改良した部品。'}};
const priceAt=(lv,tier)=>Math.round(IMP_LV[lv].price*SHOPS[tier].mult/10)*10;
const plusOf=id=>((S.impQ&&S.impQ[id])||[]).slice(0,impLv(id)).reduce((a,b)=>a+b,0);
const implantBonus=()=>IMPLANTS.reduce((n,m)=>n+sumLv(m.id,'spec')+plusOf(m.id),0);
const flesh=()=>Math.max(0,100-IMPLANTS.reduce((n,m)=>n+sumLv(m.id,'flesh'),0));
function effective(){const o=overall(S.cur);return o?Math.round(o.avg+implantBonus()):null}

const fresh=()=>({v:1,base:null,cur:null,scans:0,diff:'auto',mina:0,gate:0,started:false,light:true,pos:{},cr:0,jobs:{},imp:{},earned:0,passed:0,snd:{bgm:0.6,se:0.8,muted:false},area:'out',reached:['out'],st:{},impQ:{}});

/* ===== 音（sound.js） ===== */

function sndApply(){if(!SND)return;const o=S.snd||{};try{SND.setVolume('bgm',o.bgm??0.6);SND.setVolume('se',o.se??0.8);SND.setMuted(!!o.muted);SND.setCyber(1-flesh()/100);SND.setMood&&SND.setMood(F.zone?(F.zone.boss?'boss':'fight'):area())}catch(e){}}
const mood=m=>{try{SND&&SND.setMood&&SND.setMood(m)}catch(e){}};
let endQuiet=false;/* END の画面（バツを書く間）は BGM を止めたままにする */
function sndStart(){if(!SND)return;try{
  /* iPhone のマナーモード（消音スイッチ）でも鳴るように、再生用の音声セッションにする（Safari 17 以降） */
  if(navigator.audioSession)navigator.audioSession.type='playback';

function sndResume(){try{const c=SND&&SND.context();if(c&&c.state!=='running'&&c.state!=='closed')c.resume()}catch(e){}}
function sndStatus(){if(!SND)return 'sound.js を読み込めていません（index.html と同じ場所にあるか確認してください）';
  const c=SND.context();if(!c)return 'まだ鳴らしていません（タイトルの「はじめる」「つづきから」で鳴り始めます）';
  if(S.snd&&S.snd.muted)return 'ミュート中';if(c.state!=='running')return `一時停止中（${c.state}）。画面をタップすると再開します`;

['pointerdown','keydown'].forEach(ev=>addEventListener(ev,()=>{if(mode!=='title'&&!endQuiet)sndStart()},true));

/* 文字列の地図からドット絵を作り、Scale2x で縦横2倍の細かさにする（lw・lh が元の大きさ） */
function sprite(rows,pal){const w=rows[0].length,h=rows.length,c=document.createElement('canvas');c.width=w;c.height=h;const g=c.getContext('2d');
  rows.forEach((r,y)=>[...r].forEach((ch,x)=>{if(pal[ch]){g.fillStyle=pal[ch];g.fillRect(x,y,1,1)}}));
  const src=new Uint32Array(g.getImageData(0,0,w,h).data.buffer),o=document.createElement('canvas');o.width=w*2;o.height=h*2;
  const og=o.getContext('2d'),img=og.createImageData(w*2,h*2),dst=new Uint32Array(img.data.buffer),at=(x,y)=>x<0||y<0||x>=w||y>=h?0:src[y*w+x];
  for(let y=0;y<h;y++)for(let x=0;x<w;x++){const P=at(x,y),A=at(x,y-1),B=at(x+1,y),C=at(x-1,y),D=at(x,y+1);let e0=P,e1=P,e2=P,e3=P;
    if(A!==D&&C!==B){if(C===A)e0=A;if(A===B)e1=B;if(D===C)e2=C;if(B===D)e3=D}
    const i=y*2*w*2+x*2;dst[i]=e0;dst[i+1]=e1;dst[i+w*2]=e2;dst[i+w*2+1]=e3}
  og.putImageData(img,0,0);o.lw=w;o.lh=h;return o}

function stepFires(dt){for(const f of ST().fires){f.acc+=dt*70*f.s;while(f.acc>1){f.acc--;f.parts.push({x:f.x+(Math.random()-0.5)*7*f.s,y:f.y,vx:(Math.random()-0.5)*6,vy:-(16+Math.random()*16)*f.s,l:0,mx:0.45+Math.random()*0.45,s:1.5+Math.random()*1.5*f.s,e:Math.random()<0.05})}
  for(const p of f.parts){p.l+=dt;p.x+=(p.vx+Math.sin(p.l*14+p.y)*6)*dt;p.y+=p.vy*dt;p.vy-=(p.e?2:10)*dt}
  f.parts=f.parts.filter(p=>p.l<(p.e?p.mx*2.6:p.mx*1.6))}}
function drawFire(f,t){const ox=-camX;if(f.x+ox<-40||f.x+ox>W+40)return;
  for(const p of f.parts){const k=p.l/p.mx;if(p.e||k<1)continue;ctx.fillStyle=`rgba(70,60,72,${0.28*(1.6-k)})`;const s=p.s+1+(k-1)*4;ctx.fillRect(Math.round(p.x+ox-s/2),Math.round(p.y-s/2),s,s)}
  ctx.globalCompositeOperation='lighter';
  for(const p of f.parts){const k=p.l/p.mx;if(p.e){ctx.fillStyle=`rgba(255,${180-k*40},80,${1-k/2.6})`;ctx.fillRect(Math.round(p.x+ox),Math.round(p.y),1,1);continue}if(k>=1)continue;
    const c=k<0.15?'255,246,200':k<0.35?'255,210,90':k<0.6?'255,140,42':'224,64,26',s=p.s*(1-k*0.6);ctx.fillStyle=`rgba(${c},${0.85-k*0.5})`;ctx.fillRect(Math.round(p.x+ox-s/2),Math.round(p.y-s/2),s,s)}
  ctx.globalCompositeOperation='source-over'}

function goalNow(){const o=overall(S.cur),st=S.st||{};
  if(!o)return{k:'scan',t:'ドク・カゲロウの診療所で、ブレインスキャンを受ける',h:'診療所は圏外の中ほど。赤い十字の看板が目印。'};

  if(!st.weapon)return{k:'ray2',t:'企業区の奥にいる RAY に会う',h:'配送で上がってきている。正規クリニックの先。'};
  if(!st.tenkyu){const cur=effective(),req=gateReq('corp');if(cur>=req)return{k:'end',t:'天穹区ゲートへ行こう',h:`基準 ${req} には届いている（今 ${cur}）。企業区の奥のゲート。`};return{k:'end',t:`実効スペックを ${req} 以上にして、天穹区ゲートを通る（今 ${cur}）`,h:`企業区の奥のゲート。基準は ${GATES.corp.lb}。インプラントなしでは、ほぼ届かない。`}}

  return{k:'fin',t:`物語は終わった（エンディング ${Object.keys(S.endings||{}).length} / 5）`,h:`中央区ゲートの前からやり直せる。ソウのことと仲間は、選び直せる。${prep}`}}

function runCpu(){const times=[];let phase='wait',start=0;
  openPanel(`<div class="hud"><span>CPU · 反応速度</span><span id="cnt">0 / 5</span></div><button class="pad wait" id="pad" type="button"></button>`);
  const pad=$('#pad'),set=(c,h)=>{pad.className='pad '+c;pad.innerHTML=h};
  function arm(){phase='wait';set('wait','待って…<small>シアンに光ったらタップ</small>');timers.push(setTimeout(()=>{phase='go';start=performance.now();set('go','いま！')},1200+Math.random()*2600))}
  function hit(){if(phase==='wait'){clearTimers();phase='early';sfx('hit');set('early','フライング<small>タップでやり直し</small>')}
    else if(phase==='early'||phase==='between')arm();
    else if(phase==='go'){const ms=performance.now()-start;times.push(ms);$('#cnt').textContent=`${times.length} / 5`;
      if(times.length>=5)return testDone('cpu',Math.round(times.reduce((a,b)=>a+b)/5));phase='between';set('wait',`<span class="mono">${Math.round(ms)} ms</span><small>タップで次へ</small>`)}}
  pad.addEventListener('pointerdown',e=>{e.preventDefault();hit()});
  pad.addEventListener('keydown',e=>{if(e.key===' '||e.key==='Enter'){e.preventDefault();if(!e.repeat)hit()}});
  pad.addEventListener('click',e=>e.preventDefault());pad.focus();arm()}
function runRam(){let len=3,best=2,lives=2;
  const head=()=>`<div class="hud"><span>RAM · ${len} 桁</span><span>ミス残り ${lives}</span></div>`;
  function round(){let d='';for(let i=0;i<len;i++)d+=Math.floor(Math.random()*10);
    openPanel(`${head()}<div class="digits">${d}</div>`);
    timers.push(setTimeout(()=>{openPanel(`${head()}<p>覚えた数字を入力してください</p><form id="f" class="prow"><input id="ram-in" class="ans" inputmode="numeric" autocomplete="off" aria-label="数字"><button class="nbtn">決定</button></form>`);
      const inp=$('#ram-in');inp.focus();
      $('#f').onsubmit=e=>{e.preventDefault();
        if(inp.value.replace(/\D/g,'')===d){best=len;len++;if(len>14)return testDone('ram',best);round()}
        else{lives--;sfx('hit');if(lives<=0)return testDone('ram',best);openPanel(`${head()}<p>不正解。正解は <b class="mono">${d}</b> でした。同じ桁数でもう一度。</p>`);timers.push(setTimeout(round,1600))}}},len*550+700))}
  round()}
function runGpu(){let level=0,end=performance.now()+30000;
  openPanel(`<div class="hud"><span>GPU · 正解 <b id="sc">0</b></span><span id="tleft">30.0 秒</span></div><div class="timer"><i id="tbar"></i></div><div class="grid" id="g"></div><p class="note">間違えると1秒減ります</p>`);
  const g=$('#g');
  function board(){const n=Math.min(7,3+Math.floor(level/4)),delta=Math.max(4,24-level*1.1),h=Math.floor(Math.random()*360),l=46+Math.random()*10,odd=Math.floor(Math.random()*n*n);
    g.style.gridTemplateColumns=`repeat(${n},1fr)`;
    g.innerHTML=Array.from({length:n*n},(_,i)=>`<button type="button" aria-label="タイル${i+1}" data-o="${i===odd?1:0}" style="background:hsl(${h} 62% ${i===odd?l+delta:l}%)"></button>`).join('')}
  g.onclick=e=>{const b=e.target.closest('button');if(!b)return;if(b.dataset.o==='1'){level++;$('#sc').textContent=level;board()}else{end-=1000;sfx('hit');g.classList.remove('flash');void g.offsetWidth;g.classList.add('flash')}};
  timers.push(setInterval(()=>{const left=Math.max(0,end-performance.now());$('#tbar').style.width=(left/300)+'%';$('#tleft').textContent=(left/1000).toFixed(1)+' 秒';if(left<=0)testDone('gpu',level)},100));board()}
function runAlu(){let n=0,ans=0;const end=performance.now()+30000;
  openPanel(`<div class="hud"><span>ALU · 正解 <b id="sc">0</b></span><span id="tleft">30.0 秒</span></div><div class="timer"><i id="tbar"></i></div><div class="q" id="q"></div>
  <form id="f" class="prow" style="justify-content:center"><input id="alu-in" class="ans" inputmode="numeric" autocomplete="off" aria-label="答え"><button class="nbtn">回答</button></form><p class="note" style="text-align:center">Enterで回答。間違えても次の問題へ進みます</p>`);
  const r=(a,b)=>a+Math.floor(Math.random()*(b-a+1));
  function next(){const k=r(0,2),lv=Math.min(n,15);let a,b,op;
    if(k===0){a=r(5,20+lv*4);b=r(5,20+lv*4);op='+';ans=a+b}else if(k===1){a=r(10,30+lv*4);b=r(2,a-1);op='−';ans=a-b}else{a=r(2,6+Math.floor(lv/2));b=r(2,9);op='×';ans=a*b}
    $('#q').textContent=`${a} ${op} ${b}`}
  const inp=$('#alu-in');
  $('#f').onsubmit=e=>{e.preventDefault();if(inp.value.trim()==='')return;if(parseInt(inp.value,10)===ans){n++;$('#sc').textContent=n}else{sfx('hit');inp.classList.remove('flash');void inp.offsetWidth;inp.classList.add('flash')}inp.value='';next()};
  timers.push(setInterval(()=>{const left=Math.max(0,end-performance.now());$('#tbar').style.width=(left/300)+'%';$('#tleft').textContent=(left/1000).toFixed(1)+' 秒';if(left<=0)testDone('alu',n)},100));next();inp.focus()}

/* CPU：アーム停止（往復する印を、緑の範囲で止める） */
function runArm(d){const P=jp('arm',d);let pos=0,dir=1,spd=P.spd,zw=P.zone,z0=0.4,round=0,hits=0,miss=0,last=0,alive=true,wait=false;
  openPanel(`<div class="hud"><span>CPU · アーム停止 · 成功 <b id="sc">0</b></span><span id="lf"></span></div>
  <p class="status c" id="st">緑の範囲でレバーを引け</p><div class="track" id="tr"><div class="zone" id="zn"></div><div class="mark" id="mk"></div></div>
  <div class="prow" style="justify-content:center"><button class="nbtn" id="stop" type="button" style="padding:12px 40px;font-size:18px">止める</button></div>
  <p class="note c">Space・Enter でも止められます</p>`);
  offs.push(()=>alive=false);
  const lf=()=>$('#lf').textContent=`第 ${Math.min(round+1,P.n)} / ${P.n} 回 · 失敗 ${'◆'.repeat(Math.max(0,P.miss-miss))}${'◇'.repeat(Math.min(P.miss,miss))}`;
  const setZone=()=>{z0=0.05+Math.random()*(0.9-zw);$('#zn').style.left=z0*100+'%';$('#zn').style.width=zw*100+'%'};
  function stop(){if(!alive||wait)return;wait=true;const ok=pos>=z0&&pos<=z0+zw,tr=$('#tr');tr.classList.add(ok?'hit':'miss');
    if(ok){hits++;sfx('key');$('#sc').textContent=hits;$('#st').textContent='止めた！'}else{miss++;sfx('hit');$('#st').textContent='外れた。アームが暴れる'}
    round++;lf();
    timers.push(setTimeout(()=>{tr.classList.remove('hit','miss');if(miss>P.miss||round>=P.n)return finish();zw=Math.max(0.05,zw*0.95);spd*=1.06;setZone();$('#st').textContent='緑の範囲でレバーを引け';wait=false},550))}
  function finish(){alive=false;const ok=miss<=P.miss&&round>=P.n;jobDone('arm',d,{ok,score:hits,raw:hits*9+(ok?50:0),detail:`成功 ${hits} / ${round} 回 · 失敗 ${miss} 回`})}
  function step(ts){if(!alive)return;const dt=Math.min(0.05,(ts-last)/1000||0);last=ts;if(!wait){pos+=dir*spd*dt;if(pos>1){pos=1;dir=-1}else if(pos<0){pos=0;dir=1}}
    $('#mk').style.left=pos*100+'%';requestAnimationFrame(step)}
  $('#stop').onclick=stop;on($('#tr'),'pointerdown',e=>{e.preventDefault();stop()});
  on(window,'keydown',e=>{if((e.key===' '||e.key==='Enter')&&!e.repeat){e.preventDefault();stop()}});
  setZone();lf();requestAnimationFrame(ts=>{last=ts;step(ts)})}
/* RAM：工程手順（並びを一度に見せる。途中から逆順） */
const SYM=[['⚙','#ffb547'],['▲','#3ef2e0'],['■','#ff7ab8'],['●','#c9a0ff'],['◆','#7ff8ee'],['✚','#ff4a5c']];
function runProc(d,id='proc'){const P=jp(id,d),STAGES=5;let stage=0,lives=P.lives,reviews=P.review,raw=0,seq=[],inp=[],phase='wait',rev=false;
  openPanel(`<div class="hud"><span>RAM · ${jobOf(id).nm} · 第 <b id="sg">1</b> / ${STAGES} 工程</span><span id="lv"></span></div>
  <p class="status c" id="st"></p><div class="seq" id="sq"></div>
  <div class="syms" id="sy">${SYM.map(([c,col],i)=>`<button type="button" data-s="${i}" style="color:${col}" aria-label="記号${i+1}">${c}</button>`).join('')}</div>
  ${P.review?`<div class="prow" style="justify-content:center"><button class="nbtn ghost" id="rv" type="button" disabled>もう一度見る（残り <b id="rvn">${P.review}</b>）</button></div>`:''}
  <p class="note c">記号をタップ、またはキーボードの 1〜6${P.review?'。R で見直し':''}</p>`);
  const sq=$('#sq'),st=$('#st'),cell=(i,v)=>`<span style="color:${SYM[i]?SYM[i][1]:'var(--muted)'}">${v??(SYM[i]?SYM[i][0]:'?')}</span>`;
  const hudUp=()=>{$('#sg').textContent=Math.min(stage+1,STAGES);$('#lv').textContent='ミス残り '+'◆'.repeat(lives)+'◇'.repeat(P.lives-lives);const r=$('#rv');if(r){$('#rvn').textContent=reviews;r.disabled=phase!=='input'||reviews<=0}};
  function newStage(){seq=Array.from({length:P.len+stage},()=>rnd(0,5));rev=stage+1>=P.rev&&Math.random()<0.6;show()}
  function show(){phase='show';inp=[];hudUp();st.textContent=rev?'逆順で入力せよ。覚えろ……':'覚えろ……';sq.innerHTML=seq.map(i=>cell(i)).join('');
    timers.push(setTimeout(()=>{phase='input';sq.innerHTML=seq.map(()=>cell(-1,'?')).join('');st.textContent=rev?'逆順に入力（最後から）':'同じ順に入力';hudUp()},seq.length*P.ms+500))}
  function press(i){if(phase!=='input')return;const want=rev?seq[seq.length-1-inp.length]:seq[inp.length];
    if(i===want){inp.push(i);sfx('key');const cells=sq.querySelectorAll('span');const at=rev?seq.length-inp.length:inp.length-1;cells[at].outerHTML=cell(i);
      if(inp.length===seq.length){phase='wait';raw+=8*seq.length;stage++;hudUp();if(stage>=STAGES){st.textContent='全工程、完了';timers.push(setTimeout(()=>finish(true),800))}else{st.textContent=`第 ${stage} 工程 完了`;timers.push(setTimeout(newStage,800))}}}
    else{phase='wait';sfx('hit');lives--;hudUp();sq.innerHTML=(rev?[...seq].reverse():seq).map(j=>cell(j)).join('');
      if(lives<=0){st.textContent='工程ミス。ラインが止まった';timers.push(setTimeout(()=>finish(false),1400))}else{st.textContent='違う。正しい並び（入力する順）はこう';timers.push(setTimeout(newStage,1600))}}}

  $('#sy').onclick=e=>{const b=e.target.closest('button');if(b)press(+b.dataset.s)};
  const review=()=>{if(phase!=='input'||reviews<=0)return;reviews--;show()};if($('#rv'))$('#rv').onclick=review;
  on(window,'keydown',e=>{if(/^[1-6]$/.test(e.key)){e.preventDefault();if(!e.repeat)press(+e.key-1)}else if((e.key==='r'||e.key==='R')&&!e.repeat)review()});
  newStage()}
/* GPU：不良品検査（流れてくる部品の列から、色の違う1つを探す） */
function runInspect(d){const P=jp('inspect',d),BATCH=16;let found=0,lives=P.lives,batch=0,dur=P.dur,anim=null,over=false;
  openPanel(`<div class="hud"><span>GPU · 不良品検査 · 発見 <b id="sc">0</b> / ${P.q}</span><span id="lv"></span></div>
  <p class="status c" id="st">色の違う部品を、流れ去る前にタップ</p><div class="belt" id="bt"></div><p class="note c">ロット <b id="bn">1</b> / ${BATCH}</p>`);
  const bt=$('#bt'),hudUp=()=>{$('#lv').textContent='ミス残り '+'◆'.repeat(Math.max(0,lives))+'◇'.repeat(P.lives-Math.max(0,lives));$('#bn').textContent=Math.min(batch+1,BATCH)};
  offs.push(()=>{over=true;anim&&anim.cancel()});
  function next(){if(over)return;if(batch>=BATCH||lives<=0)return finish();hudUp();const h=Math.random()*360,s=50+Math.random()*25,l=45+Math.random()*12,odd=rnd(0,P.n-1),dl=Math.max(3,P.d-found*0.8),sgn=Math.random()<0.5?-1:1;

    const rw=$('#rw'),W0=bt.clientWidth;rw.style.transform=`translateX(${W0}px)`;
    anim=rw.animate([{transform:`translateX(${W0}px)`},{transform:`translateX(${-rw.scrollWidth}px)`}],{duration:dur*1000,easing:'linear',fill:'forwards'});
    anim.onfinish=()=>{if(over)return;lives--;sfx('hit');$('#st').textContent='見逃した！';batch++;next()};
    if(P.glow){const ob=rw.querySelector('[data-o="1"]');ob.classList.add('glow');timers.push(setTimeout(()=>ob.classList.remove('glow'),P.glow*1000+400))}}
  bt.onclick=e=>{const b=e.target.closest('button');if(!b||over)return;
    if(b.dataset.o==='1'){found++;sfx('key');$('#sc').textContent=found;$('#st').textContent='不良品を発見';anim.onfinish=null;anim.cancel();batch++;dur=Math.max(1.6,dur*0.96);next()}

  next()}
/* ALU：配合計算（合計が目標になる部品を選ぶ） */
function runMix(d,id='mix'){const P=jp(id,d);let solved=0,target=0,sel=[],end=performance.now()+P.T*1000,over=false;
  openPanel(`<div class="hud"><span>ALU · ${jobOf(id).nm} · 成功 <b id="sc">0</b> / ${P.q}</span><span id="tleft">${P.T.toFixed(1)} 秒</span></div><div class="timer"><i id="tbar"></i></div>

    if(sel.length===P.k){const sum=sel.reduce((a,j)=>a+vals[j],0);if(sum===target){solved++;$('#sc').textContent=solved;next()}else{end-=3000;sfx('hit');shake($('#tl'));sel=[];timers.push(setTimeout(()=>$('#tl').querySelectorAll('button').forEach(b=>b.classList.remove('on')),200))}}}

  timeBar(()=>end,P.T,()=>{if(over)return;over=true;const ok=solved>=P.q;jobDone(id,d,{ok,score:solved,raw:solved*14+(ok?50:0),detail:`成功 ${solved} 回 / ノルマ ${P.q} 回`})});next()}

/* CPU：ドローン回避（5列。照準線が出た列にレーザーが落ちる） */
const DRONE=sprite(["r.......r","rrr...rrr",".ggggggg.","..gGeGg..","...g.g..."],{r:'#5c6378',g:'#2c2750',G:'#8e8aa6',e:'#ff4a5c'});
function runDrone(d,id='drone'){const P=jp(id,d),DUR=30,NL=5,CW=200,CH=112,LW=CW/NL,BEAM=0.22;
  openPanel(`<div class="hud"><span>CPU · ${jobOf(id).nm} · 回避 <b id="sc">0</b></span><span id="sh"></span></div><div class="timer"><i id="tbar"></i></div>
  <canvas class="mcv" id="dcv" width="${CW*2}" height="${CH*2}" role="img" aria-label="5列の道。上から警備ドローンが照準を合わせてくる"></canvas>
  <div class="prow" style="justify-content:space-between"><button class="kbtn" id="dl" type="button" aria-label="左の列へ">◀</button><span class="note">赤い線の列から逃げろ</span><button class="kbtn" id="dr" type="button" aria-label="右の列へ">▶</button></div>`);
  const c=$('#dcv').getContext('2d');c.setTransform(2,0,0,2,0,0);c.imageSmoothingEnabled=false;
  let lane=2,vx=lane*LW+LW/2,t=0,last=0,alive=true,shields=P.sh,inv=0,hitFx=0,dodged=0,nextSpawn=1,hz=[];
  offs.push(()=>alive=false);
  const shUp=()=>$('#sh').textContent='シールド '+'◆'.repeat(Math.max(0,shields))+'◇'.repeat(P.sh-Math.max(0,shields));shUp();
  const move=dx=>{if(alive)lane=clamp(lane+dx,0,NL-1)};
  on(window,'keydown',e=>{if(e.repeat)return;if(e.key==='ArrowLeft'||e.key==='a'||e.key==='A'){e.preventDefault();move(-1)}else if(e.key==='ArrowRight'||e.key==='d'||e.key==='D'){e.preventDefault();move(1)}});
  const cvs=$('#dcv');on(cvs,'pointerdown',e=>{e.preventDefault();const r=cvs.getBoundingClientRect();move(e.clientX-r.left<r.width/2?-1:1)});
  on($('#dl'),'pointerdown',e=>{e.preventDefault();move(-1)});on($('#dr'),'pointerdown',e=>{e.preventDefault();move(1)});
  function spawn(){const p=t/DUR,warn=P.w0+(P.w1-P.w0)*p;
    const busy=new Set(hz.filter(h=>t<h.fire+BEAM).map(h=>h.lane));
    let k=1;if(p>0.3&&Math.random()<0.5)k=2;if(p>0.65&&Math.random()<0.4)k=3;k=Math.min(k,NL-2-busy.size);
    for(let i=0;i<k;i++){const free=[...Array(NL).keys()].filter(l=>!busy.has(l));if(!free.length)break;
      const l=i===0&&!busy.has(lane)&&Math.random()<0.6?lane:free[Math.floor(Math.random()*free.length)];
      busy.add(l);hz.push({lane:l,t0:t,fire:t+warn,hit:false})}
    nextSpawn=t+Math.max(0.45,1.05-0.5*p)*(0.85+Math.random()*0.3)}
  function finish(ok){if(!alive)return;alive=false;draw();
    timers.push(setTimeout(()=>jobDone(id,d,{ok,score:dodged,raw:dodged*4+(ok?60:0),detail:`${ok?'走破':'撃墜'} · 回避 ${dodged} 回 · 残りシールド ${Math.max(0,shields)}`}),700))}
  function step(ts){if(!alive)return;const dt=Math.min(0.05,(ts-last)/1000||0);last=ts;t+=dt;
    if(t>=nextSpawn)spawn();
    for(const h of hz){
      if(t>=h.fire&&t<h.fire+BEAM&&!h.hit&&h.lane===lane){h.hit=true;if(t>=inv){shields--;sfx('hit');inv=t+0.8;hitFx=t+0.15;shUp();if(shields<=0)return finish(false)}}
      if(t>=h.fire+BEAM&&!h.done){h.done=true;if(!h.hit){dodged++;$('#sc').textContent=dodged}}}
    hz=hz.filter(h=>t<h.fire+BEAM+0.4);
    vx+=(lane*LW+LW/2-vx)*Math.min(1,dt*28);
    $('#tbar').style.width=Math.max(0,(1-t/DUR)*100)+'%';
    if(t>=DUR)return finish(true);
    draw();requestAnimationFrame(step)}
  function draw(){
    for(let i=0;i<NL;i++){c.fillStyle=i%2?'#0d0b1a':'#0a0816';c.fillRect(i*LW,0,LW,CH)}
    c.fillStyle='#1d1838';for(let i=1;i<NL;i++)for(let y=(t*90)%14-14;y<CH;y+=14)c.fillRect(i*LW,Math.round(y),1,6);
    for(const h of hz){const cx=h.lane*LW+LW/2;
      if(t<h.fire){const k=(t-h.t0)/(h.fire-h.t0);if(Math.floor(t*(6+k*16))%2===0){c.fillStyle=`rgba(255,74,92,${0.3+0.5*k})`;c.fillRect(cx-1,9,2,CH-9)}}
      else if(t<h.fire+BEAM){c.fillStyle='rgba(255,61,139,.4)';c.fillRect(cx-6,6,12,CH);c.fillStyle='#ffd6ea';c.fillRect(cx-2,6,4,CH)}
      const dy=t<h.fire+BEAM?Math.min(2,-6+(t-h.t0)*30):2-(t-h.fire-BEAM)*40;
      c.drawImage(DRONE,Math.round(cx-4),Math.round(dy),DRONE.lw,DRONE.lh)}
    if(t>=inv||Math.floor(t*14)%2){const spr=Math.floor(t*8)%2?P_B:P_A;c.drawImage(spr,Math.round(vx-5),CH-19,spr.lw,spr.lh)}
    if(t<hitFx){c.fillStyle='rgba(255,74,92,.35)';c.fillRect(0,0,CW,CH)}}
  draw();requestAnimationFrame(ts=>{last=ts;requestAnimationFrame(step)})}

/* RAM：パスコード侵入（光った順にキーを押す） */
function runPass(d){const P=jp('pass',d),LAYERS=5;let layer=0,lives=P.lives,raw=0,seq=[],inp=[],phase='wait';
  openPanel(`<div class="hud"><span>RAM · パスコード侵入 · 第 <b id="ly">1</b> / ${LAYERS} 層</span><span id="lv"></span></div>
  <p class="status c" id="st"></p><div class="keypad" id="kp">${[1,2,3,4,5,6,7,8,9].map(k=>`<button type="button" data-k="${k}">${k}</button>`).join('')}</div>
  ${P.review?`<div class="prow" style="justify-content:center"><button class="nbtn ghost" id="rv" type="button" disabled>もう一度見る（残り <b id="rvn">${P.review}</b>）</button></div>`:''}
  <p class="note c">光った順にキーを押す。キーボードの 1〜9 でも入力できます${P.review?'。R で見直し':''}</p>`);
  const kp=$('#kp'),st=$('#st'),key=k=>kp.querySelector(`[data-k="${k}"]`);
  const hudUp=()=>{$('#ly').textContent=Math.min(layer+1,LAYERS);$('#lv').textContent='ミス残り '+'◆'.repeat(lives)+'◇'.repeat(P.lives-lives)};
  let reviews=P.review;const rvUp=()=>{const r=$('#rv');if(r){$('#rvn').textContent=reviews;r.disabled=phase!=='input'||reviews<=0}};
  function play(){seq=[];let p=0;for(let i=0;i<P.len+layer;i++){let k;do k=rnd(1,9);while(k===p);seq.push(k);p=k}show()}
  function show(again){phase='show';inp=[];rvUp();
    kp.querySelectorAll('button').forEach(b=>b.className='');st.textContent=again?'記憶バッファから再生中……':`盗聴中…… ${seq.length} 桁`;
    let at=600;seq.forEach(k=>{timers.push(setTimeout(()=>key(k).classList.add('lit'),at));timers.push(setTimeout(()=>key(k).classList.remove('lit'),at+P.ms));at+=P.ms*1.35});
    timers.push(setTimeout(()=>{phase='input';st.textContent=`入力 0 / ${seq.length}`;rvUp()},at))}
  function press(k){if(phase!=='input')return;const b=key(k);
    if(k===seq[inp.length]){inp.push(k);sfx('key');b.classList.remove('hit');void b.offsetWidth;b.classList.add('hit');timers.push(setTimeout(()=>b.classList.remove('hit'),200));st.textContent=`入力 ${inp.length} / ${seq.length}`;
      if(inp.length===seq.length){phase='wait';rvUp();raw+=6*seq.length;layer++;
        if(layer>=LAYERS){st.textContent='全層突破。アクセス権を奪取';timers.push(setTimeout(()=>finish(true),900))}
        else{st.textContent=`第 ${layer} 層 突破`;timers.push(setTimeout(()=>{hudUp();play()},900))}}}
    else{phase='wait';rvUp();sfx('hit');b.classList.add('bad');key(seq[inp.length]).classList.add('lit');lives--;hudUp();
      if(lives<=0){st.textContent='侵入検知。回線を切断された';timers.push(setTimeout(()=>finish(false),1400))}
      else{st.textContent='コード不一致。次の入力を待つ……';timers.push(setTimeout(play,1400))}}}
  function finish(ok){jobDone('pass',d,{ok,score:layer,raw:raw+(ok?50:0),detail:`突破 ${layer} / ${LAYERS} 層`})}
  const review=()=>{if(phase!=='input'||reviews<=0)return;reviews--;show(true)};
  if($('#rv'))$('#rv').onclick=review;
  kp.onclick=e=>{const b=e.target.closest('button');if(b)press(+b.dataset.k)};
  on(window,'keydown',e=>{if(/^[1-9]$/.test(e.key)){e.preventDefault();if(!e.repeat)press(+e.key)}else if((e.key==='r'||e.key==='R')&&!e.repeat)review()});
  hudUp();play()}

/* GPU：監視カメラ解析（指定色の上着を着た人物を探す） */
const FIG=["..hhhh..",".hhhhhh.",".hssssh.","..ssss..","..jjjj..",".jjjjjj.","jjjjjjjj","sjjjjjjs","sjjjjjjs",".jjjjjj.","..pppp..","..p..p..","..p..p..",".bb..bb."];
const HAIR=['#2b2438','#5a3a2a','#c9c6d8','#1a1630','#7a2a4a','#2a5a58'],SKIN=['#d9a07a','#b97f5a','#f0c5a0','#8a5a3c'];
const figURL=(j,h,s)=>sprite(FIG,{h,s,j,p:'#191828',b:'#0b0a12'}).toDataURL();
function runCam(d,id='cam'){const P=jp(id,d);let found=0,end=performance.now()+P.T*1000,over=false;
  openPanel(`<div class="hud"><span>GPU · ${jobOf(id).nm} · 特定 <b id="sc">0</b> / ${P.q}</span><span id="tleft">${P.T.toFixed(1)} 秒</span></div><div class="timer"><i id="tbar"></i></div>
  <div class="target">対象の上着<i id="tg"></i></div><div class="feeds" id="fd"></div>
  <p class="note c">同じ色の上着の人物をタップ。間違えると2秒減ります</p>`);
  const fd=$('#fd'),col=(h,s,l)=>`hsl(${Math.round((h+360)%360)},${Math.round(s)}%,${Math.round(l)}%)`;
  function board(){const n=Math.min(5,3+Math.floor(found/4)),delta=Math.max(P.dm,P.d0-found*1.3);
    const h=Math.random()*360,s=55+Math.random()*20,l=42+Math.random()*16,odd=Math.floor(Math.random()*n*n);
    $('#tg').style.background=col(h,s,l);fd.style.gridTemplateColumns=`repeat(${n},1fr)`;
    fd.innerHTML=Array.from({length:n*n},(_,i)=>{let c=col(h,s,l);
      if(i!==odd){const m=(0.6+Math.random()*0.4)*(Math.random()<0.5?-1:1);c=Math.random()<0.5?col(h+m*delta*1.6,s,l):col(h,s,l+m*delta*0.7)}
      return `<button type="button" aria-label="カメラ${i+1}" data-o="${i===odd?1:0}"><img alt="" src="${figURL(c,HAIR[rnd(0,HAIR.length-1)],SKIN[rnd(0,SKIN.length-1)])}"></button>`}).join('');
    if(P.glow){const tb=fd.querySelector('[data-o="1"]');tb.classList.add('glow');timers.push(setTimeout(()=>tb.classList.remove('glow'),P.glow*1000))}}
  fd.onclick=e=>{const b=e.target.closest('button');if(!b||over)return;if(b.dataset.o==='1'){found++;$('#sc').textContent=found;board()}else{end-=2000;sfx('hit');shake(fd)}};
  timeBar(()=>end,P.T,()=>{if(over)return;over=true;const ok=found>=P.q;jobDone(id,d,{ok,score:found,raw:found*10+(ok?40:0),detail:`特定 ${found} 人 / ノルマ ${P.q} 人`})});board()}

/* ALU：暗号ロック解除（□ に入る数を答える。3問で1錠） */
function runLock(d){const P=jp('lock',d);let tum=0,locks=0,total=0,ans=0,end=performance.now()+P.T*1000,over=false;
  openPanel(`<div class="hud"><span>ALU · 暗号ロック解除 · 解錠 <b id="sc">0</b> / ${P.q}</span><span id="tleft">${P.T.toFixed(1)} 秒</span></div><div class="timer"><i id="tbar"></i></div>
  <div class="tum" id="tm"></div><div class="q" id="q"></div>
  <form id="f" class="prow" style="justify-content:center"><input id="lk-in" class="ans" inputmode="numeric" autocomplete="off" aria-label="□ に入る数"><button class="nbtn">回す</button></form>
  <p class="note c">□ に入る数を答える。タンブラー3つで1錠。間違えると3秒減ります</p>`);
  const tumUp=()=>$('#tm').innerHTML=`LOCK ${String(locks+1).padStart(2,'0')}`+[0,1,2].map(i=>`<i class="${i<tum?'on':''}"></i>`).join('');
  function next(){const s=P.s*(1+total*0.06),k=rnd(0,P.div?3:2);let q;
    if(k===0){const a=rnd(3,Math.round(12*s)),b=rnd(3,Math.round(12*s));if(Math.random()<0.5){q=`□ + ${b} = ${a+b}`;ans=a}else{q=`${a} + □ = ${a+b}`;ans=b}}
    else if(k===1){const c=rnd(10,Math.round(25*s)),b=rnd(2,c-1);q=`${c} − □ = ${c-b}`;ans=b}
    else if(k===2){const a=rnd(2,Math.round(4+2*s)),b=rnd(2,9);q=`${a} × □ = ${a*b}`;ans=b}
    else{const b=rnd(2,9),v=rnd(2,Math.round(3+2*s));q=`□ ÷ ${b} = ${v}`;ans=b*v}
    $('#q').textContent=q}
  const inp=$('#lk-in');
  $('#f').onsubmit=e=>{e.preventDefault();if(over||inp.value.trim()==='')return;
    if(parseInt(inp.value,10)===ans){total++;tum++;if(tum>=3){tum=0;locks++;$('#sc').textContent=locks}tumUp()}else{end-=3000;sfx('hit');shake(inp)}
    inp.value='';next()};
  timeBar(()=>end,P.T,()=>{if(over)return;over=true;const ok=locks>=P.q;jobDone('lock',d,{ok,score:locks,raw:total*8+locks*20+(ok?40:0),detail:`解錠 ${locks} 錠 / ノルマ ${P.q} 錠 · タンブラー ${total} 個`})});
  tumUp();next();inp.focus()}

/* ===== 第2層・企業区の仕事（専用のミニゲーム） ===== */
/* CPU：警備網の突破（レーザーの柵が消えた瞬間に駆け抜ける） */
function runGuard(d){const P=jp('guard',d),CW=200,CH=112,GAP=34,id='guard';
  openPanel(`<div class="hud"><span>CPU · 警備網の突破 · 突破 <b id="sc">0</b> / ${P.n}</span><span id="sh"></span></div><div class="timer"><i id="tbar"></i></div>
  <canvas class="mcv" id="gcv" width="${CW*2}" height="${CH*2}" role="img" aria-label="社内の通路。レーザーの柵が点いたり消えたりしている"></canvas>
  <div class="prow" style="justify-content:center"><button class="nbtn" id="gogo" type="button">駆け抜ける</button></div>
  <p class="note c">柵が消えている間に、Space・Enter・→ か「駆け抜ける」。赤く点滅したら、もうすぐ点く</p>`);
  const c=$('#gcv').getContext('2d');c.setTransform(2,0,0,2,0,0);c.imageSmoothingEnabled=false;
  let t=0,last=0,alive=true,shields=P.sh,passed=0,dash=null,px=24,inv=0,hitFx=0;
  /* 柵ごとに、点いている時間・消えている時間・ずれを決める（奥ほど消えている時間が短い） */
  const fences=Array.from({length:P.n},(_,i)=>{const k=i/Math.max(1,P.n-1),off=P.off0+(P.off1-P.off0)*k;return{off,on:P.on*(0.85+Math.random()*0.4),ph:Math.random()*3}});
  const lit=(f,tt)=>{const per=f.on+f.off,m=((tt+f.ph)%per+per)%per;return m<f.on};
  const warn=(f,tt)=>{const per=f.on+f.off,m=((tt+f.ph)%per+per)%per;return m>=per-0.35};
  offs.push(()=>alive=false);
  const shUp=()=>$('#sh').textContent='シールド '+'◆'.repeat(Math.max(0,shields))+'◇'.repeat(P.sh-Math.max(0,shields));shUp();
  const go=()=>{if(!alive||dash||passed>=P.n)return;dash={t0:t,from:px};sfx('step')};
  on(window,'keydown',e=>{if(e.repeat)return;if(e.key===' '||e.key==='Enter'||e.key==='ArrowRight'||e.key==='d'||e.key==='D'){e.preventDefault();go()}});
  on($('#gogo'),'pointerdown',e=>{e.preventDefault();go()});on($('#gcv'),'pointerdown',e=>{e.preventDefault();go()});
  function finish(ok){if(!alive)return;alive=false;draw();
    timers.push(setTimeout(()=>jobDone(id,d,{ok,score:passed,raw:passed*14+(ok?60:0),detail:`${ok?'突破':'捕捉'} · 柵 ${passed} / ${P.n} · 残りシールド ${Math.max(0,shields)}`}),700))}
  function step(ts){if(!alive)return;const dt=Math.min(0.05,(ts-last)/1000||0);last=ts;t+=dt;
    if(dash){const k=Math.min(1,(t-dash.t0)/0.28);px=dash.from+GAP*k;
      /* 柵の線を越える瞬間に点いていたら、捕まる */
      const f=fences[passed];if(k>=0.5&&!dash.chk){dash.chk=1;if(lit(f,t)&&t>=inv){shields--;sfx('hit');inv=t+0.6;hitFx=t+0.2;shUp();dash=null;px=24+passed*GAP;if(shields<=0)return finish(false)}}
      if(dash&&k>=1){dash=null;passed++;px=24+passed*GAP;$('#sc').textContent=passed;sfx('key');if(passed>=P.n)return finish(true)}}
    const left=Math.max(0,1-t/P.T);$('#tbar').style.width=left*100+'%';if(left<=0)return finish(false);
    draw();requestAnimationFrame(step)}
  function draw(){const cam=Math.max(0,Math.min(px-50,24+P.n*GAP+30-CW));
    c.fillStyle='#e8eef8';c.fillRect(0,0,CW,CH);c.fillStyle='#c9d4e6';c.fillRect(0,CH-30,CW,30);c.fillStyle='#b4c2da';for(let x=-(cam%24);x<CW;x+=24)c.fillRect(x,CH-30,1,30);
    c.fillStyle='#d6e0f0';for(let x=-(Math.round(cam*0.5)%40);x<CW;x+=40){c.fillRect(x,10,26,44);c.fillStyle='#9fb4d6';c.fillRect(x+2,12,22,40);c.fillStyle='#d6e0f0'}
    c.fillStyle='#3a8aff';c.fillRect(0,CH-31,CW,1);
    fences.forEach((f,i)=>{const x=Math.round(24+(i+0.5)*GAP-cam+GAP*0.0);if(x<-4||x>CW+4)return;c.fillStyle='#5a6478';c.fillRect(x-1,CH-62,3,32);c.fillRect(x-1,CH-66,3,2);
      if(i<passed)return;if(lit(f,t)){c.fillStyle='rgba(255,61,90,.35)';c.fillRect(x-3,CH-62,7,32);c.fillStyle='#ff3d5a';for(let y=CH-60;y<CH-31;y+=5)c.fillRect(x-1,y,3,2);c.fillStyle='#ffd6de';c.fillRect(x,CH-62,1,31)}
      else if(warn(f,t)&&Math.floor(t*14)%2){c.fillStyle='rgba(255,61,90,.5)';for(let y=CH-60;y<CH-31;y+=5)c.fillRect(x,y,1,2)}});
    const gx=Math.round(24+P.n*GAP+16-cam);c.fillStyle='#3ef2e0';c.fillRect(gx,CH-64,2,34);c.fillRect(gx+10,CH-64,2,34);c.fillRect(gx,CH-66,12,2);
    if(t>=inv||Math.floor(t*14)%2){const spr=dash?P_B:P_A;c.drawImage(spr,Math.round(px-cam-5),CH-31-spr.lh,spr.lw,spr.lh)}
    if(t<hitFx){c.fillStyle='rgba(255,74,92,.35)';c.fillRect(0,0,CW,CH)}}
  draw();requestAnimationFrame(ts=>{last=ts;requestAnimationFrame(step)})}
/* RAM：会議の盗聴（誰が、どの数字を言ったかを覚える） */
const EXEC=[['社長','#ff7ab8'],['専務','#3ef2e0'],['常務','#ffb547'],['部長','#c9a0ff'],['課長','#7ff8ee']];
const AGENDA=['人員','予算','査定の基準','配置転換','広告費','警備費','義体の補助金'];
function runMeeting(d){const P=jp('meeting',d),ROUNDS=6,id='meeting';let round=0,lives=P.lives,reviews=P.review,raw=0,said=[],q=null,phase='wait';
  openPanel(`<div class="hud"><span>RAM · 会議の盗聴 · 議題 <b id="sg">1</b> / ${ROUNDS}</span><span id="lv"></span></div>
  <p class="status c" id="st"></p><div class="minutes" id="mn"></div><div class="qs" id="qs"></div>
  ${P.review?`<div class="prow" style="justify-content:center"><button class="nbtn ghost" id="rv" type="button" disabled>もう一度聞く（残り <b id="rvn">${P.review}</b>）</button></div>`:''}
  <p class="note c">発言は一瞬で流れる。誰が、何と言ったかを覚えろ${P.review?'。R で聞き直し':''}</p>`);
  const mn=$('#mn'),st=$('#st'),qs=$('#qs');
  const hudUp=()=>{$('#sg').textContent=Math.min(round+1,ROUNDS);$('#lv').textContent='ミス残り '+'◆'.repeat(lives)+'◇'.repeat(P.lives-lives);const r=$('#rv');if(r){$('#rvn').textContent=reviews;r.disabled=phase!=='ask'||reviews<=0}};
  const line=([w,v])=>`<div class="mline"><b style="color:${EXEC[w][1]}">${EXEC[w][0]}</b><span>${v}</span></div>`;
  function newRound(){const k=P.k+Math.floor(round/2),who=[...EXEC.keys()].sort(()=>Math.random()-0.5).slice(0,Math.min(k,EXEC.length)),ag=AGENDA[rnd(0,AGENDA.length-1)];
    const used=new Set();said=who.map(w=>{let v;do{v=(Math.random()<0.5?'−':'＋')+rnd(1,9)*(Math.random()<0.5?10:100)}while(used.has(v));used.add(v);return[w,v]});
    const [w,v]=said[rnd(0,said.length-1)];
    if(Math.random()<0.5){const opts=[v,...said.filter(s=>s[1]!==v).map(s=>s[1])];while(opts.length<4){const x=(Math.random()<0.5?'−':'＋')+rnd(1,9)*(Math.random()<0.5?10:100);if(!opts.includes(x))opts.push(x)}
      q={text:`「${ag}」について、${EXEC[w][0]}は何と言った？`,ans:v,opts:opts.slice(0,4).sort(()=>Math.random()-0.5)}}
    else q={text:`「${ag}」について、「${v}」と言ったのは？`,ans:EXEC[w][0],opts:[EXEC[w][0],...EXEC.filter((_,i)=>i!==w).map(e=>e[0]).sort(()=>Math.random()-0.5)].slice(0,4).sort(()=>Math.random()-0.5)};
    q.ag=ag;play()}
  function play(){phase='show';qs.innerHTML='';mn.innerHTML='';hudUp();st.textContent=`議題「${q.ag}」……盗聴中`;
    said.forEach((s,i)=>timers.push(setTimeout(()=>{mn.innerHTML=line(s);sfx('text')},i*P.ms)));
    timers.push(setTimeout(()=>{mn.innerHTML='<div class="mline muted">（会議は次の議題へ）</div>';ask()},said.length*P.ms))}
  function ask(){phase='ask';st.textContent=q.text;qs.innerHTML=q.opts.map((o,i)=>`<button class="nbtn" type="button" data-a="${esc(o)}">${i+1}. ${esc(o)}</button>`).join('');hudUp()}
  function answer(a){if(phase!=='ask')return;phase='wait';hudUp();qs.innerHTML='';
    if(a===q.ans){raw+=10+said.length*6;round++;sfx('key');st.textContent='議事録に書き取った';if(round>=ROUNDS)return timers.push(setTimeout(()=>finish(true),700));timers.push(setTimeout(newRound,800))}
    else{lives--;sfx('hit');shake(qs);hudUp();st.textContent=`違う。正しくは「${q.ans}」`;mn.innerHTML=said.map(line).join('');
      if(lives<=0)return timers.push(setTimeout(()=>finish(false),1600));round++;if(round>=ROUNDS)return timers.push(setTimeout(()=>finish(true),1600));timers.push(setTimeout(newRound,1900))}}
  function finish(ok){jobDone(id,d,{ok,score:round,raw:raw+(ok?60:0),detail:`書き取り ${round} / ${ROUNDS} 議題 · ミス ${P.lives-lives} 回`})}
  qs.onclick=e=>{const b=e.target.closest('button');if(b)answer(b.dataset.a)};
  const review=()=>{if(phase!=='ask'||reviews<=0)return;reviews--;play()};if($('#rv'))$('#rv').onclick=review;
  on(window,'keydown',e=>{if(/^[1-4]$/.test(e.key)&&phase==='ask'){e.preventDefault();if(!e.repeat){const o=q.opts[+e.key-1];if(o!=null)answer(o)}}else if((e.key==='r'||e.key==='R')&&!e.repeat)review()});
  newRound()}
/* GPU：偽造身分証の照合（登録データと見比べて、色の違うドットを探す） */
function runIdcheck(d){const P=jp('idcheck',d),N=6,id='idcheck';let found=0,checked=0,end=performance.now()+P.T*1000,over=false,odd=-1,real=false;
  openPanel(`<div class="hud"><span>GPU · 偽造身分証の照合 · 見抜いた <b id="sc">0</b> / ${P.q}</span><span id="tleft">${P.T.toFixed(1)} 秒</span></div><div class="timer"><i id="tbar"></i></div>
  <div class="idcards"><div class="idc"><p class="note">登録データ</p><div class="idg" id="ga"></div></div><div class="idc"><p class="note">提示された身分証</p><div class="idg tap" id="gb"></div></div></div>
  <div class="prow" style="justify-content:center"><button class="nbtn ghost" id="ok" type="button">本物（0）</button></div>
  <p class="note c">右の身分証で、色の違うドットをタップ。違いがなければ「本物」。間違えると3秒減ります</p>`);
  function next(){const h=Math.random()*360,base=Array.from({length:N*N},(_,i)=>{const y=Math.floor(i/N),x=i%N,face=x>0&&x<N-1&&y>0;
      return{h:face?(y<2?h:(h+30)%360):(h+180)%360,s:face?35+Math.random()*25:20+Math.random()*20,l:face?40+Math.random()*25:22+Math.random()*12}});
    real=Math.random()<0.22;odd=real?-1:rnd(0,N*N-1);const dl=Math.max(P.dm,P.d0-found*1.6),sg=Math.random()<0.5?-1:1;
    const col=(c,i)=>i===odd?(Math.random()<0.5?`hsl(${Math.round((c.h+sg*dl*1.8+360)%360)},${Math.round(c.s)}%,${Math.round(c.l)}%)`:`hsl(${Math.round(c.h)},${Math.round(c.s)}%,${Math.round(c.l+sg*dl*0.6)}%)`):`hsl(${Math.round(c.h)},${Math.round(c.s)}%,${Math.round(c.l)}%)`;
    $('#ga').innerHTML=base.map(c=>`<i style="background:${col(c,-2)}"></i>`).join('');
    $('#gb').innerHTML=base.map((c,i)=>`<button type="button" data-i="${i}" aria-label="ドット${i+1}" style="background:${col(c,i)}"></button>`).join('');
    if(P.glow&&odd>=0){const b=$('#gb').children[odd];b.classList.add('glow');timers.push(setTimeout(()=>b.classList.remove('glow'),P.glow*1000+400))}}
  function judge(i){if(over)return;checked++;
    if(i===odd||(i===-1&&real)){found++;sfx('key');$('#sc').textContent=found;next()}
    else{end-=3000;sfx('hit');shake($('#gb'));next()}}
  $('#gb').onclick=e=>{const b=e.target.closest('button');if(b)judge(+b.dataset.i)};$('#ok').onclick=()=>judge(-1);
  on(window,'keydown',e=>{if(e.key==='0'){e.preventDefault();if(!e.repeat)judge(-1)}});
  timeBar(()=>end,P.T,()=>{if(over)return;over=true;const ok=found>=P.q;jobDone(id,d,{ok,score:found,raw:found*12+(ok?50:0),detail:`見抜いた ${found} 枚 / ノルマ ${P.q} 枚 · 照合 ${checked} 枚`})});next()}
/* ALU：帳簿の改ざん（残高が合うように、空欄の金額を書き込む） */
function runLedger(d){const P=jp('ledger',d),id='ledger';let done=0,total=0,ans=0,end=performance.now()+P.T*1000,over=false;
  openPanel(`<div class="hud"><span>ALU · 帳簿の改ざん · 合わせた <b id="sc">0</b> / ${P.q} 件</span><span id="tleft">${P.T.toFixed(1)} 秒</span></div><div class="timer"><i id="tbar"></i></div>
  <div class="ledger" id="lg"></div>
  <form id="f" class="prow" style="justify-content:center"><input id="lg-in" class="ans" inputmode="numeric" autocomplete="off" aria-label="□ に書き込む金額"><button class="nbtn">書き込む</button></form>
  <p class="note c">最後の残高が目標になるように、□ の金額を書き込め。間違えると3秒減ります</p>`);
  const IN=['売上','補助金','利息','雑収入'],OUT=['人件費','義体の保守費','警備費','広告費','接待費'];
  function next(){const rows=P.rows+Math.floor(total/3),s=1+total*0.08;const ls=[];
    for(let i=0;i<rows;i++){const inc=Math.random()<0.5,v=rnd(1,Math.round(P.max*s/10))*(P.max>=400?10:1)+(P.max>=400?rnd(0,9):0);ls.push({nm:inc?IN[rnd(0,IN.length-1)]:OUT[rnd(0,OUT.length-1)],v:inc?v:-v})}
    /* 残高がマイナスにならないように、前期の残高を決める */
    const start=rnd(5,30)*10+ls.reduce((a,r)=>a+(r.v<0?-r.v:0),0),bal=start+ls.reduce((a,r)=>a+r.v,0);
    const k=rnd(0,rows-1);ans=Math.abs(ls[k].v);ls[k].blank=1;
    $('#lg').innerHTML=`<div class="lrow"><span>前期の残高</span><b>${start.toLocaleString()}</b></div>`+ls.map(r=>`<div class="lrow"><span>${r.nm}</span><b class="${r.v<0?'neg':'pos'}">${r.v<0?'−':'＋'} ${r.blank?'<i>□</i>':Math.abs(r.v).toLocaleString()}</b></div>`).join('')+`<div class="lrow tot"><span>残高（目標）</span><b>${bal.toLocaleString()}</b></div>`}
  const inp=$('#lg-in');
  $('#f').onsubmit=e=>{e.preventDefault();if(over||inp.value.trim()==='')return;
    if(parseInt(inp.value.replace(/[^\d]/g,''),10)===ans){total++;done++;sfx('key');$('#sc').textContent=done}else{end-=3000;sfx('hit');shake(inp)}
    inp.value='';next()};
  timeBar(()=>end,P.T,()=>{if(over)return;over=true;const ok=done>=P.q;jobDone(id,d,{ok,score:done,raw:done*16+(ok?50:0),detail:`合わせた ${done} 件 / ノルマ ${P.q} 件`})});
  next();inp.focus()}

/* ===== 入力 ===== */
const inField=e=>/INPUT|TEXTAREA|SELECT/.test(e.target.tagName);
addEventListener('keydown',e=>{if(e.key==='Shift')keys.run=true;if(inField(e))return;const k=e.key;
  if(mode==='play'&&actArea()){
    if((k==='ArrowUp'||k==='w'||k==='W'||k===' ')){if(e.target.tagName==='BUTTON'&&k===' ')return;e.preventDefault();if(!e.repeat)jump();return}
    if(k==='x'||k==='X'||k==='j'||k==='J'){e.preventDefault();keys.fire=true;return}
    if(k==='c'||k==='C'||k==='l'||k==='L'){e.preventDefault();if(!e.repeat)dodge();return}}
  if(mode==='play'){if(k==='ArrowLeft'||k==='a'||k==='A'){keys.l=true;e.preventDefault()}else if(k==='ArrowRight'||k==='d'||k==='D'){keys.r=true;e.preventDefault()}
    else if((k==='f'||k==='F')&&!e.repeat){setLight(!S.light)}
    else if(k===' '||k==='Enter'||k==='z'||k==='Z'){if(e.target.tagName==='BUTTON'&&e.target.id!=='kA')return;e.preventDefault();if(!e.repeat)interact()}}
  else if(mode==='dialog'){if(k==='ArrowLeft'||k==='ArrowUp'){e.preventDefault();moveSel(-1)}else if(k==='ArrowRight'||k==='ArrowDown'){e.preventDefault();moveSel(1)}
    else if(k===' '||k==='Enter'||k==='z'||k==='Z'){e.preventDefault();if(e.repeat)return;if(D&&!D.typing&&D.lines[D.i].choices)pick(D.sel);else advance()}}
  else if(mode==='title'&&(k==='Enter'||k===' ')&&e.target.tagName!=='BUTTON'){e.preventDefault();startGame()}});
addEventListener('keyup',e=>{const k=e.key;if(k==='Shift')keys.run=false;if(k==='x'||k==='X'||k==='j'||k==='J')keys.fire=false;if(k==='ArrowLeft'||k==='a'||k==='A')keys.l=false;if(k==='ArrowRight'||k==='d'||k==='D')keys.r=false});
addEventListener('blur',()=>{keys.l=keys.r=keys.run=keys.fire=false});
function hold(el,key){const on=e=>{e.preventDefault();keys[key]=true},off=()=>keys[key]=false;el.addEventListener('pointerdown',on);['pointerup','pointerleave','pointercancel'].forEach(t=>el.addEventListener(t,off));el.addEventListener('contextmenu',e=>e.preventDefault())}
hold($('#kL'),'l');hold($('#kR'),'r');hold($('#kF'),'fire');
$('#kJ').addEventListener('pointerdown',e=>{e.preventDefault();jump()});$('#kDg').addEventListener('pointerdown',e=>{e.preventDefault();dodge()});
$('#kRun').addEventListener('click',e=>{keys.runT=!keys.runT;e.currentTarget.setAttribute('aria-pressed',keys.runT)});
$('#kA').addEventListener('click',()=>{if(mode==='play')interact();else if(mode==='dialog'){if(D&&!D.typing&&D.lines[D.i].choices)pick(D.sel);else advance()}});
cv.addEventListener('pointerdown',()=>{if(mode==='dialog')advance()});

/* ===== タイトル ===== */
function titleButtons(){const has=S.started,en=S.endings||{};$('#endRec').innerHTML=Object.keys(en).length?`エンディング ${Object.keys(en).length}/5<br>${[1,2,3,4,5].map(i=>en[i]?`END${i} ${END_NAMES[i]}`:'？？？').join('　')}`:'';$('#titleBtns').innerHTML=(has?'<button class="nbtn" id="cont" type="button">つづきから</button><button class="nbtn ghost" id="newg" type="button">はじめから</button>':'<button class="nbtn" id="newg" type="button">はじめる</button>');
  const c=$('#cont');if(c)c.onclick=startGame;$('#newg').onclick=()=>{if(has){S={...fresh(),snd:S.snd,endings:S.endings};save();hud()}startGame()};($('#cont')||$('#newg')).focus({preventScroll:true})}
function startGame(){sndStart();if(!SND)toast('音のファイル（sound.js）を読み込めなかったため、音なしで動いています',6000);document.activeElement&&document.activeElement.blur();$('#title').hidden=true;mode='play';placePlayer();
  if(!S.started){S.started=true;save();talk([L('me','……東京の光が、今夜もあんなに遠い。'),L('me','子どものころ、あの光の中を見てみたいと思った。……今も、思ってる。'),L('me','村の畑と、ランタンの灯り。ここには、電気もほとんど来ない。'),L('me','あの光の中に入るには、脳のスペックがいる。……まずは、誰かに話を聞こう。')])}}
/* 層ごとの位置（S.pos[層].sx＝横の位置）。v0.13〜v0.18 の見下ろしの位置（{x,y}、北がゲート）は、ゲートまでの近さで横の位置に置き換える */
const TOP_H=480;
function placePlayer(){if(S.area==='top'){S.area='sky';S.pos={...(S.pos||{}),sky:{sx:1840}}}const a=area(),st=STAGES[a];resetFight(true);let p=(S.pos||{})[a],x=null;
  if(p&&typeof p.sx==='number')x=p.sx;
  else if(p&&typeof p.y==='number')x=Math.round((1-clamp(p.y/TOP_H,0,1))*(st.len-60))+20;
  else if(a==='out'&&typeof S.oy==='number')x=Math.round((1-clamp(S.oy/TOP_H,0,1))*(st.len-60))+20;
  if(x==null||!isFinite(x))x=st.start;player.x=clamp(x,12,st.len-12);player.y=groundAt(player.x);player.vx=player.vy=0;
  camX=clamp(Math.round(player.x-W*0.42),0,CAMMAX_OF(a));if(S.light==null)S.light=a==='out';placeAllies()}
function savePos(){S.pos={...(S.pos||{}),[area()]:{sx:Math.round(player.x)}}}
setInterval(()=>{if(mode!=='title'){savePos();save()}},3000);
/* ===== 持ち物（ライト） ===== */
function setLight(on,quiet){S.light=!!on;save();sfx('ui');if(!quiet)toast(on?'ライトをつけた':'ライトを消した',2400);if($('#lt'))$('#lt').textContent=S.light?'消す':'つける'}
function itemsPanel(){openPanel(`<div class="eyebrow">ITEMS · 持ち物</div><h3>持ち物</h3>
  <div class="goal"><b>ライト（懐中電灯）</b><p class="note" style="margin-top:4px">向いている方を照らす。暗い圏外では手放せない。沈殿街は明るいので、ふだんはしまっておく。</p>
    <p style="margin:6px 0 0">いま：<span id="ltNow">${S.light?'ついている':'しまってある'}</span></p></div>
  ${S.st&&S.st.weapon?`<div class="goal"><b>パルスガン（鋼組の裏ルート品）</b><p class="note" style="margin-top:4px">保安機体用の銃。RAY から受け取った。「今度は、引きずり下ろさねえように使え」。使うのは、天穹区から。</p></div>`:''}
  ${S.st&&S.st.sou?`<div class="goal"><b>仲間（サイボーグ化率）</b><p class="note" style="margin-top:4px">リク ${rikCy()}%／ミナ 0%（生身）／ソウ ${SOU_CY}%（${souEvac()?'圏外の村に避難':'一緒に行く'}）${(S.party||[]).map(id=>`／${WHO[id]} ${PARTY[id].cy}%`).join('')}</p><p class="note">仲間は、天穹区・企業区・沈殿街の何人かに頼める。中央区ゲートの前で待っている。</p></div>`:''}
  <p class="note">キーボードの F キーでも、ライトをつけたり消したりできる。</p>
  <div class="prow"><button class="nbtn" id="lt" type="button">${S.light?'消す':'つける'}</button><button class="nbtn ghost" id="cl" type="button">閉じる</button></div>`);
  $('#lt').onclick=()=>{setLight(!S.light,true);$('#ltNow').textContent=S.light?'ついている':'しまってある'};$('#cl').onclick=()=>closePanel();$('#lt').focus()}

/* 画面の大きさ：スマホの縦向きでは、カメラを寄せて（見える範囲を横 176 に狭くして）人物を大きく映す。縦は少しだけ広げる（横スクロールなので、上に広げても空と天井しか映らない） */
function fitView(){const fr=$('#frame');if(fr.classList.contains('is-panel'))return;const phone=innerWidth<=600&&innerHeight>innerWidth;let w=320,h=180;
  {const dl=$('#dlg'),home=phone?$('.wrap'):fr;if(dl.parentNode!==home)home.appendChild(dl);dl.classList.toggle('out',phone)}
  if(phone){w=176;const fw=fr.clientWidth||innerWidth-32,others=$('.wrap').offsetHeight-fr.offsetHeight+($('#dlg').hidden?118:0),avail=innerHeight-others-40;h=clamp(Math.round(w*avail/fw),150,212)}
  if(w===W&&h===H)return;W=w;H=h;cv.width=W*2;cv.height=H*2;fr.style.setProperty('--ar',`${W}/${H}`);darkC=null;ctx.imageSmoothingEnabled=false}
addEventListener('resize',fitView);
function start(data){if(data&&data.S)S=Object.assign(fresh(),data.S);placePlayer();hud();titleButtons();fitView();requestAnimationFrame(loop)}
window.claude?.hot?.snapshot?.(()=>({S}));
window.claude?.hot?.ready?window.claude.hot.ready(start):start(window.claude?.hot?.data??{});
})();
</script>
