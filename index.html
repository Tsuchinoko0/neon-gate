<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>NEON GATE</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DotGothic16&family=M+PLUS+1+Code:wght@400;600&display=swap">
<style>
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0}
img{max-width:100%}
/* Layout: 上に状態バー、中央に16:9のドット絵画面（会話・スキャンは画面の上に重ねる）、下に操作ボタン。夜の街の単一ダークテーマ */
:root{
  --void:#07060d; --panel:#110e20; --panel2:#1a1530; --line:#2e2750;
  --ink:#ebe6ff; --muted:#948cbb; --pink:#ff3d8b; --cyan:#3ef2e0; --amber:#ffb547; --red:#ff4a5c;
  --f-dot:"DotGothic16","M PLUS 1 Code",monospace;
  --f-data:"M PLUS 1 Code","SFMono-Regular",Consolas,monospace;
  color-scheme:dark;
}
[hidden]{display:none!important}
*{box-sizing:border-box}
html,body{background:var(--void);color:var(--ink)}
body{font-family:var(--f-dot);font-size:15px;line-height:1.6;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px 32px}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--cyan);outline-offset:2px}
.wrap{max-width:960px;margin:0 auto;display:flex;flex-direction:column;gap:10px}
.head{display:flex;flex-wrap:wrap;align-items:baseline;justify-content:space-between;gap:4px 16px}
.head h1{margin:0;font-weight:400;font-size:clamp(24px,5vw,34px);letter-spacing:.08em;color:var(--ink);text-shadow:0 0 12px rgba(255,61,139,.55)}
.eyebrow{font-family:var(--f-data);font-size:11px;letter-spacing:.16em;color:var(--muted)}

.bar{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-family:var(--f-data);font-size:12px}
.chip{border:1px solid var(--line);background:var(--panel);padding:3px 9px;border-radius:2px;white-space:nowrap;font-variant-numeric:tabular-nums}
.chip.area{color:var(--amber);border-color:rgba(255,181,71,.35)}
.chip.spec{color:var(--cyan);border-color:rgba(62,242,224,.35)}
.chip.cr{color:var(--pink);border-color:rgba(255,61,139,.35)}
.bar .sp{flex:1}
.bar{position:relative}
.sndpop{position:absolute;right:0;top:calc(100% + 6px);z-index:20;width:min(340px,100%);background:var(--panel);border:1px solid var(--line);border-top:2px solid var(--cyan);padding:12px 14px;display:grid;gap:10px;box-shadow:0 8px 24px rgba(0,0,0,.5)}
.sndpop .vol{flex-direction:column;align-items:stretch}
.sndpop .vol label{display:grid;grid-template-columns:4.5em minmax(0,1fr) 3.2em}
.sndpop .vol input{width:100%}
.vol output{min-width:3.2em;text-align:right;color:var(--cyan);font-variant-numeric:tabular-nums}
.tbtn{background:var(--panel);border:1px solid var(--line);padding:4px 12px;border-radius:2px;font-family:var(--f-data);font-size:12px}
.tbtn:hover{border-color:var(--cyan)}

.frame{position:relative;width:100%;aspect-ratio:16/9;background:#000;border:1px solid var(--line);overflow:hidden;max-width:100%}
.frame.is-panel{aspect-ratio:auto;min-height:440px;background:var(--panel)}
#cv{display:block;width:100%;height:100%;image-rendering:pixelated;image-rendering:crisp-edges;touch-action:manipulation}

/* タイトル */
.title{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:clamp(6px,2vw,14px);background:linear-gradient(transparent 30%,rgba(7,6,13,.75));text-align:center;padding:12px}
.title h2{margin:0;font-weight:400;font-size:clamp(30px,9vw,76px);letter-spacing:.12em;line-height:1;color:#fff;text-shadow:0 0 6px var(--pink),0 0 22px var(--pink),3px 0 0 rgba(62,242,224,.6)}
.title p{margin:0;font-size:clamp(11px,2vw,15px);color:var(--muted)}
.title .row{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
.nbtn{background:transparent;border:1px solid var(--cyan);color:var(--cyan);padding:6px 18px;border-radius:2px;font-size:clamp(12px,2vw,16px);letter-spacing:.06em}
.nbtn:hover,.nbtn.sel{background:var(--cyan);color:var(--void)}
.nbtn.pink{border-color:var(--pink);color:var(--pink)}
.nbtn.pink:hover{background:var(--pink);color:var(--void)}
.nbtn.ghost{border-color:var(--line);color:var(--muted)}

/* 会話 */
.dlg{position:absolute;left:3%;right:3%;bottom:4%;background:rgba(9,7,20,.93);border:1px solid var(--line);border-left:3px solid var(--cyan);padding:clamp(6px,1.4vw,12px) clamp(10px,2vw,16px);font-size:clamp(12px,2.1vw,18px);line-height:1.55;cursor:pointer;min-height:28%}
.dlg .who{font-size:.78em;color:var(--cyan);letter-spacing:.1em}
.dlg.npc-doc{border-left-color:var(--red)} .dlg.npc-doc .who{color:var(--red)}
.dlg.npc-mina{border-left-color:var(--pink)} .dlg.npc-mina .who{color:var(--pink)}
.dlg.npc-gate{border-left-color:var(--amber)} .dlg.npc-gate .who{color:var(--amber)}
.dlg.npc-me{border-left-color:var(--muted)} .dlg.npc-me .who{color:var(--muted)}
.dlg .txt{min-height:2.6em}
.dlg .more{position:absolute;right:12px;bottom:6px;color:var(--cyan);animation:blink 1s steps(2) infinite}
.dlg .ch{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.dlg .ch .nbtn{font-size:clamp(11px,1.9vw,15px);padding:3px 12px}
@keyframes blink{50%{opacity:0}}

.toast{position:absolute;left:50%;top:5%;transform:translateX(-50%);background:rgba(9,7,20,.94);border:1px solid var(--amber);color:var(--amber);padding:6px 14px;font-size:clamp(11px,1.9vw,15px);max-width:90%;text-align:center}

/* パネル（スキャン・結果・設定） */
.panel{padding:clamp(14px,3vw,26px);display:flex;flex-direction:column;gap:14px;min-height:440px}
.panel h3{margin:0;font-weight:400;font-size:clamp(20px,4vw,28px)}
.panel p{margin:0;max-width:62ch}
.panel .muted{color:var(--muted)}
.mono{font-family:var(--f-data);font-variant-numeric:tabular-nums}
.prow{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.plist{margin:0;padding:0;list-style:none;display:grid;gap:6px}
.plist li{display:grid;grid-template-columns:52px 1fr;gap:10px;align-items:baseline}
.tag{font-family:var(--f-data);font-weight:600;font-size:12px;color:var(--cyan);letter-spacing:.08em}
.hud{display:flex;justify-content:space-between;font-family:var(--f-data);font-size:13px;color:var(--muted)}
.timer{height:4px;background:var(--panel2)}
.timer i{display:block;height:100%;background:var(--amber);width:100%}
.pad{flex:1;min-height:240px;border:1px solid var(--line);display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:22px;user-select:none;-webkit-user-select:none;touch-action:manipulation}
.pad small{font-size:13px;opacity:.85}
.pad.wait{background:var(--panel2);color:var(--muted)}
.pad.go{background:var(--cyan);color:var(--void)}
.pad.early{background:var(--red);color:#fff}
.digits{font-family:var(--f-data);font-size:clamp(30px,8vw,52px);letter-spacing:.18em;text-align:center;padding-block:44px;font-weight:600;word-break:break-all;color:var(--cyan);text-shadow:0 0 12px rgba(62,242,224,.5)}
.ans{font-family:var(--f-data);font-size:22px;padding:8px 12px;border:1px solid var(--line);background:var(--void);color:var(--ink);width:100%;max-width:300px;letter-spacing:.08em;border-radius:2px}
.q{font-family:var(--f-data);font-size:clamp(30px,7vw,44px);font-weight:600;text-align:center;padding-block:24px 8px}
.grid{display:grid;gap:5px;width:100%;max-width:340px;aspect-ratio:1;margin:0 auto}
.grid button{border:0;padding:0;border-radius:1px}
.flash{animation:fl .25s}
@keyframes fl{50%{transform:translateX(6px)}}
.note{font-size:12px;color:var(--muted);margin:0;font-family:var(--f-data)}

/* 仕事 */
.jobs{display:grid}
.job{display:grid;grid-template-columns:44px minmax(0,1fr) auto;gap:0 12px;align-items:center;padding-block:10px;border-top:1px solid var(--line)}
.job .nm{font-size:17px}
.job .ex{grid-column:2;font-size:12px;color:var(--muted);font-family:var(--f-data)}
.job .nbtn{grid-column:3;grid-row:1/3}
.job .act{grid-column:3;grid-row:1/3;display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.nbtn:disabled,.nbtn:disabled:hover{opacity:.45;cursor:default;background:transparent;color:var(--muted);border-color:var(--line)}
.mcv{display:block;width:100%;max-width:640px;margin:0 auto;aspect-ratio:200/112;image-rendering:pixelated;image-rendering:crisp-edges;border:1px solid var(--line);background:#000;touch-action:none}
.panel .c{max-width:none;text-align:center}
.status{font-family:var(--f-data);color:var(--amber);min-height:1.6em}
.frame.is-panel~.ctrl{visibility:hidden}
.keypad{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;width:100%;max-width:300px;margin:0 auto}
.keypad button{aspect-ratio:1.4;background:var(--panel2);border:1px solid var(--line);font-family:var(--f-data);font-size:24px;font-weight:600;color:var(--muted);border-radius:2px;touch-action:manipulation}
.keypad button.lit{background:var(--cyan);border-color:var(--cyan);color:var(--void);box-shadow:0 0 18px rgba(62,242,224,.6)}
.keypad button.hit{color:var(--cyan);border-color:var(--cyan)}
.keypad button.bad{background:var(--red);border-color:var(--red);color:#fff}
.target{display:flex;align-items:center;justify-content:center;gap:12px;font-family:var(--f-data);font-size:13px;color:var(--muted)}
.target i{display:block;width:48px;height:28px;border:2px solid var(--ink)}
.feeds{display:grid;gap:4px;width:100%;max-width:360px;margin:0 auto}
.feeds button{aspect-ratio:1;padding:0;border:1px solid #1d1a33;border-radius:1px;background:#0d0b18 repeating-linear-gradient(0deg,rgba(255,255,255,.04) 0 1px,transparent 1px 3px);display:flex;align-items:center;justify-content:center}
.feeds img{height:78%;image-rendering:pixelated;image-rendering:crisp-edges;pointer-events:none}
.tum{display:flex;gap:8px;justify-content:center;align-items:center;font-family:var(--f-data);font-size:13px;color:var(--muted)}
.tum i{display:block;width:14px;height:22px;border:1px solid var(--line);background:var(--panel2)}
.tum i.on{background:var(--cyan);border-color:var(--cyan)}
.feeds button.glow{box-shadow:inset 0 0 0 2px var(--cyan),0 0 16px rgba(62,242,224,.75)}
.pips{font-family:var(--f-data);font-size:12px;color:var(--cyan);letter-spacing:.1em;margin-left:8px}
.vol{display:flex;flex-wrap:wrap;gap:10px 18px;align-items:center;font-family:var(--f-data);font-size:13px}
.vol label{display:flex;align-items:center;gap:8px}
.vol input{accent-color:var(--cyan);width:140px}
.earn{font-family:var(--f-data);font-size:clamp(30px,7vw,46px);font-weight:600;color:var(--pink);margin:0;text-shadow:0 0 12px rgba(255,61,139,.45)}

.sheet{display:grid;gap:8px}
.srow{display:grid;grid-template-columns:44px minmax(0,1fr) auto;gap:4px 12px;align-items:center;padding-block:8px;border-top:1px solid var(--line)}
.srow .v{font-family:var(--f-data);font-weight:600;white-space:nowrap}
.srow .ex{grid-column:2/-1;font-size:12px;color:var(--muted);font-family:var(--f-data)}
.meter{grid-column:2/-1;height:6px;background:var(--panel2)}
.meter i{display:block;height:100%;background:var(--cyan)}
.model{font-size:clamp(22px,5vw,34px);margin:0;letter-spacing:.04em;word-break:break-word}
.klass{color:var(--pink);margin:0}
.stats{display:flex;flex-wrap:wrap;gap:8px}
.stat{border:1px solid var(--line);padding:6px 12px;display:grid;gap:0;min-width:120px}
.stat b{font-family:var(--f-data);font-size:20px;font-weight:600}
.stat span{font-size:11px;color:var(--muted);font-family:var(--f-data)}
.seg{display:flex;flex-wrap:wrap;gap:6px}

/* 操作 */
.ctrl{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.keys{display:flex;gap:10px}
.kbtn{width:64px;height:52px;background:var(--panel);border:1px solid var(--line);font-size:20px;border-radius:2px;user-select:none;-webkit-user-select:none;touch-action:none}
.kbtn.act{width:auto;padding:0 18px;font-size:15px;color:var(--cyan);border-color:rgba(62,242,224,.45)}
.kbtn:active{background:var(--panel2)}
.hint{font-family:var(--f-data);font-size:12px;color:var(--muted)}
@media (max-width:560px){.hint{display:none}}
@media (prefers-reduced-motion:reduce){.flash,.dlg .more{animation:none}}
</style>
</head>
<body>
<div class="wrap">
  <header class="head">
    <h1>NEON GATE</h1>
    <span class="eyebrow">PROTOTYPE v0.5 · 脳スペック診断 続編</span>
  </header>

  <div class="bar" aria-live="polite">
    <span class="chip area" id="areaChip">圏外 · 東京の外</span>
    <span class="chip spec" id="specChip">未スキャン</span>
    <span class="chip cr" id="crChip">0 CR</span>
    <span class="sp"></span>
    <button class="tbtn" id="sndBtn" type="button" aria-expanded="false" aria-controls="sndPop">音量</button>
    <button class="tbtn" id="setBtn" type="button">設定</button>
    <div class="sndpop" id="sndPop" hidden></div>
  </div>

  <div class="frame" id="frame">
    <canvas id="cv" width="320" height="180" role="img" aria-label="東京の外のスラム街。遠くに東京の光が見える"></canvas>
    <div class="title" id="title">
      <h2>NEON GATE</h2>
      <p>脳のスペックで、住める場所が決まる街。</p>
      <div class="row" id="titleBtns"></div>
    </div>
    <div class="dlg" id="dlg" hidden><div class="who" id="dlgWho"></div><div class="txt" id="dlgTxt"></div><div class="ch" id="dlgCh"></div><span class="more" id="dlgMore">▼</span></div>
    <div class="toast" id="toast" hidden></div>
    <div class="panel" id="panel" hidden></div>
  </div>

  <div class="ctrl">
    <div class="keys">
      <button class="kbtn" id="kL" type="button" aria-label="左へ歩く">◀</button>
      <button class="kbtn" id="kR" type="button" aria-label="右へ歩く">▶</button>
    </div>
    <span class="hint">キーボード：← → で移動 ／ Space・Enter で話す</span>
    <button class="kbtn act" id="kA" type="button">話す</button>
  </div>
</div>

<script src="sound.js?v=0.5"></script>
<script>
(()=>{
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const clamp=(v,a=0,b=100)=>Math.max(a,Math.min(b,v));

/* ===== 脳スペック（診断サイトと同じ換算） ===== */
const TESTS=[
  {id:'cpu',tag:'CPU',nm:'反応速度',desc:'パッドがシアンに光った瞬間にタップ。5回の平均反応時間を測ります。'},
  {id:'ram',tag:'RAM',nm:'短期記憶',desc:'表示される数字を覚えて入力。桁数が増えていきます。ミスは2回まで。'},
  {id:'gpu',tag:'GPU',nm:'色の識別',desc:'1枚だけ色が違うタイルをタップ。30秒でいくつ見つけられるか。'},
  {id:'alu',tag:'ALU',nm:'暗算',desc:'計算問題に30秒間答え続けます。間違えても次へ進みます。'}
];
const ghz=ms=>800/ms, gb=s=>2**(s-3), tflops=n=>0.3*1.2**n, cores=n=>Math.max(1,Math.round(n*0.8));
function score(id,v){if(v==null)return null;if(id==='cpu')return clamp((450-v)/(450-180)*100);if(id==='ram')return clamp((v-3)/(10-3)*100);return clamp(v/30*100)}
const fmtGB=g=>g<1?Math.round(g*1024)+' MB':g+' GB';
function spec(id,v){
  if(v==null)return{main:'—',raw:'未計測'};
  if(id==='cpu')return{main:ghz(v).toFixed(2)+' GHz',raw:`平均反応 ${Math.round(v)} ms`};
  if(id==='ram')return{main:fmtGB(gb(v)),raw:`記憶スパン ${v} 桁`};
  if(id==='gpu'){const t=tflops(v);return{main:(t<10?t.toFixed(1):Math.round(t))+' TFLOPS',raw:`識別 ${v} 回 / 30秒`}}
  return{main:cores(v)+' コア',raw:`正答 ${v} 問 / 30秒`};
}
const LADDERS={
  cpu:[[v=>v<=190,'最上位デスクトップCPU級'],[v=>v<=220,'ハイエンドCPU級'],[v=>v<=260,'ミドルCPU級'],[v=>v<=320,'エントリーCPU級'],[v=>v<=400,'格安ノートPC級'],[()=>true,'Raspberry Pi 級']],
  ram:[[v=>v>=10,'サーバー級'],[v=>v>=9,'ワークステーション級'],[v=>v>=8,'ハイエンドゲーミングPC級'],[v=>v>=7,'標準的なゲーミングPC級'],[v=>v>=6,'一般的なノートPC級'],[v=>v>=5,'数年前のスマホ級'],[()=>true,'初期のスマホ級']],
  gpu:[[v=>tflops(v)>=105,'RTX 5090 級'],[v=>tflops(v)>=83,'RTX 4090 級'],[v=>tflops(v)>=29,'RTX 4070 級'],[v=>tflops(v)>=10,'PlayStation 5 級'],[v=>tflops(v)>=4,'Xbox Series S 級'],[v=>tflops(v)>=1.8,'PlayStation 4 級'],[v=>tflops(v)>=0.4,'Nintendo Switch 級'],[()=>true,'電卓・ガラケー級']],
  alu:[[v=>cores(v)>=24,'Core i9 級'],[v=>cores(v)>=16,'Ryzen 9 級'],[v=>cores(v)>=8,'Ryzen 7 級'],[v=>cores(v)>=6,'Ryzen 5 級'],[v=>cores(v)>=4,'Core i3 級'],[v=>cores(v)>=2,'Celeron 級'],[()=>true,'初期のパソコン級']]
};
const like=(id,v)=>LADDERS[id].find(r=>r[0](v))[1];
const TIERS=[
  {max:12,code:'N100',name:'ポケット電卓級'},{max:28,code:'N200',name:'事務用ノートPC級'},{max:45,code:'N300',name:'標準デスクトップ級'},
  {max:62,code:'N500',name:'ミドルゲーミングPC級'},{max:78,code:'N700',name:'ハイエンドゲーミングPC級'},{max:92,code:'N900',name:'ワークステーション級'},{max:101,code:'N-X',name:'スーパーコンピュータ級'}
];
function overall(d){if(!d||TESTS.some(t=>d[t.id]==null))return null;const avg=TESTS.reduce((s,t)=>s+score(t.id,d[t.id]),0)/4;return{avg,tier:TIERS.find(x=>avg<x.max)}}
const DIFF={easy:'EASY',normal:'NORMAL',hard:'HARD'};
const autoDiff=avg=>avg<40?'easy':avg<70?'normal':'hard';
function diffNow(){const o=overall(S.cur);return S.diff!=='auto'?S.diff:(o?autoDiff(o.avg):'normal')}
function gateReq(){const b=overall(S.base);if(!b)return null;return Math.min(100,Math.max(Math.ceil(b.avg*1.1),Math.ceil(b.avg)+3))}
/* インプラント：スキャン値には入らず、実効スペックと仕事にだけ効く。部位ごとに Lv1〜3 */
const GLOW=0.3;
const IMPLANTS=[
  {id:'reflex',stat:'cpu',job:'drone',nm:'反射ブースター',desc:'脊髄に入れる信号増幅器。体が考えるより先に動く。',eff:lv=>`ドローン回避：シールド +${lv}`},
  {id:'buffer',stat:'ram',job:'pass',nm:'記憶バッファ',desc:'海馬の横に差す小さな外部記憶。見たものをもう一度呼び出せる。',eff:lv=>`パスコード侵入：見直せる回数 +${lv}`},
  {id:'optic',stat:'gpu',job:'cam',nm:'光学センサー',desc:'網膜に重ねる色解析レンズ。標的を一瞬だけ光らせる。',eff:lv=>`監視カメラ解析：標的が ${Math.round(lv*GLOW*10)/10} 秒光る`},
  {id:'copro',stat:'alu',job:'lock',nm:'演算コプロセッサ',desc:'前頭葉に並べる計算チップ。暗算を肩代わりする。',eff:lv=>`暗号ロック解除：制限時間 +${lv*5} 秒`}
];
const IMP_LV=[{price:400,spec:4,flesh:10},{price:800,spec:3,flesh:10},{price:1400,spec:2,flesh:5}],IMP_MAX=IMP_LV.length;
const impLv=id=>clamp(Math.floor(+(S.imp&&S.imp[id])||0),0,IMP_MAX);

{const R=rng(7);let x=0;while(x<500){const t=x/500,tk=t>0.58;const w=Math.round(tk?7+R()*13:10+R()*22),h=Math.round(tk?36+R()*90*t:5+R()*20);

  /* 中景 */

    if(b.tank){ctx.fillStyle='#0c0a16';ctx.fillRect(sx+6,GY-b.h-7,9,7);ctx.fillRect(sx+7,GY-b.h-9,7,2)}
    if(b.ant){ctx.fillStyle='#151228';ctx.fillRect(sx+b.w-8,GY-b.h-12,1,12);ctx.fillRect(sx+b.w-11,GY-b.h-9,7,1)}}
  for(const w of midWin){const sx=w.x-mo;if(sx<-3||sx>W)continue;if(w.f&&!flick(t,w.s))continue;ctx.fillStyle='#5a3d17';ctx.fillRect(sx,w.y,3,2)}
  for(const s of signs){const sx=s.x-mo;if(sx<-20||sx>W)continue;const on=!s.broken||flick(t,s.s);
    if(on){ctx.globalAlpha=0.18;ctx.fillStyle=s.c;ctx.fillRect(sx-3,s.y-3,s.w+6,s.h+6);ctx.globalAlpha=1}
    ctx.fillStyle=on?s.c:'#2a2238';ctx.fillRect(sx,s.y,s.w,s.h)}
  /* 圏外の暗さ（中心へ進むほど薄くなる） */
  ctx.fillStyle=`rgba(4,3,10,${0.42*(1-prog)})`;ctx.fillRect(0,0,W,H);

  const X=x=>Math.round(x-camX);
  /* 地面 */
  ctx.fillStyle='#0b0a14';ctx.fillRect(0,GY,W,H-GY);ctx.fillStyle='#211c38';ctx.fillRect(0,GY,W,1);
  ctx.fillStyle='#16132a';for(let x=-(camX%24);x<W;x+=24)ctx.fillRect(Math.round(x),GY+16,10,1);
  for(const p of PUDDLES){const sx=X(p.x);if(sx>W||sx+p.w<0)continue;ctx.fillStyle='#141127';ctx.fillRect(sx,GY+6,p.w,3);ctx.fillStyle=flick(t,p.x)?'rgba(255,61,139,.45)':'rgba(62,242,224,.3)';ctx.fillRect(sx+3,GY+7,p.w-8,1)}

  /* 診療所 */
  {const bx=X(420);if(bx<W&&bx+96>0){ctx.fillStyle='#120f22';ctx.fillRect(bx,GY-92,96,92);ctx.fillStyle='#231e3d';ctx.fillRect(bx,GY-92,96,1);ctx.fillRect(bx,GY-92,1,92);ctx.fillRect(bx+95,GY-92,1,92);

  /* ゲート（奥から光が漏れる） */
  {const gx0=X(872);if(gx0<W+10){
    let lg=ctx.createLinearGradient(gx0,0,gx0+120,0);lg.addColorStop(0,'rgba(220,245,255,0.05)');lg.addColorStop(1,'rgba(220,245,255,0.75)');ctx.fillStyle=lg;ctx.fillRect(gx0+12,30,140,GY-30);
    ctx.fillStyle='rgba(255,180,230,.18)';ctx.fillRect(gx0+12,GY,140,H-GY);
    ctx.fillStyle='#1c1932';ctx.fillRect(gx0,36,12,GY-36);ctx.fillStyle='#2c2750';ctx.fillRect(gx0,36,12,1);
    for(let y=GY-14;y<GY;y+=4){ctx.fillStyle=((y/4)%2)?'#ffb547':'#1c1932';ctx.fillRect(gx0,y,12,2)}
    ctx.fillStyle='#211d3a';for(const by of [62,90,118])ctx.fillRect(gx0+12,by,140,4);
    const col=gateLight==='deny'?'#ff4a5c':gateLight==='ok'?'#3ef2e0':(Math.floor(t*2)%2?'#ffb547':'#7a5520');
    ctx.fillStyle='#0d0b18';ctx.fillRect(gx0+1,96,10,10);ctx.fillStyle=col;ctx.fillRect(gx0+3,98,6,6);
    ctx.globalAlpha=0.25;ctx.fillRect(gx0-4,92,20,18);ctx.globalAlpha=1}}

  /* 街灯 */
  for(const l of LAMPS){const sx=X(l.x);if(sx<-40||sx>W+40)continue;ctx.fillStyle='#1a1630';ctx.fillRect(sx,GY-52,2,52);ctx.fillRect(sx,GY-52,9,2);

function near(){let best=null,bd=24;for(const n of NPCS){const d=Math.abs(n.x-player.x);if(d<bd){bd=d;best=n}}return best}

let mode='title',last=0,titlePan=0,stepIdx=0,lastBright=-1;
function loop(ts){const t=ts/1000,dt=Math.min(0.05,(ts-last)/1000||0);last=ts;
  if(mode==='play'){const dx=(keys.r?1:0)-(keys.l?1:0);player.moving=dx!==0;
    if(dx){player.dir=dx;player.x=clamp(player.x+dx*62*dt,12,846);player.step+=dt;const si=Math.floor(player.step*2.5);if(si!==stepIdx){stepIdx=si;sfx('step')}}
    camX=clamp(Math.round(player.x-130),0,CAMMAX);
    const br=Math.round(camX/CAMMAX*50)/50;if(br!==lastBright){lastBright=br;try{SND&&SND.setBrightness(br)}catch(e){}}}
  else if(mode==='title'){titlePan+=dt*14;camX=Math.round((Math.sin(titlePan/120)*0.5+0.5)*CAMMAX*0.55)}
  for(const d of drops){d.y+=d.v*dt;d.x-=d.v*dt*0.22;if(d.y>H){d.y=-4;d.x=Math.random()*(W+40)}if(d.x<0)d.x+=W}
  if(gateLight!=='idle'&&ts>gateLightUntil)gateLight='idle';
  if(mode!=='panel')draw(t);
  requestAnimationFrame(loop)}

function runCpu(){const times=[];let phase='wait',start=0;
  openPanel(`<div class="hud"><span>CPU · 反応速度</span><span id="cnt">0 / 5</span></div><button class="pad wait" id="pad" type="button"></button>`);
  const pad=$('#pad'),set=(c,h)=>{pad.className='pad '+c;pad.innerHTML=h};
  function arm(){phase='wait';set('wait','待って…<small>シアンに光ったらタップ</small>');timers.push(setTimeout(()=>{phase='go';start=performance.now();set('go','いま！')},1200+Math.random()*2600))}
  function hit(){if(phase==='wait'){clearTimers();phase='early';sfx('hit');set('early','フライング<small>タップでやり直し</small>')}
    else if(phase==='early'||phase==='between')arm();
    else if(phase==='go'){const ms=performance.now()-start;times.push(ms);$('#cnt').textContent=`${times.length} / 5`;
      if(times.length>=5)return testDone('cpu',Math.round(times.reduce((a,b)=>a+b)/5));phase='between';set('wait',`<span class="mono">${Math.round(ms)} ms</span><small>タップで次へ</small>`)}}
  pad.addEventListener('pointerdown',e=>{e.preventDefault();hit()});
  pad.addEventListener('keydown',e=>{if(e.key===' '||e.key==='Enter'){e.preventDefault();if(!e.repeat)hit()}});

/* CPU：ドローン回避（5列。照準線が出た列にレーザーが落ちる） */
const DRONE=sprite(["r.......r","rrr...rrr",".ggggggg.","..gGeGg..","...g.g..."],{r:'#5c6378',g:'#2c2750',G:'#8e8aa6',e:'#ff4a5c'});
function runDrone(d){const P=jp('drone',d),DUR=30,NL=5,CW=200,CH=112,LW=CW/NL,BEAM=0.22;
  openPanel(`<div class="hud"><span>CPU · ドローン回避 · 回避 <b id="sc">0</b></span><span id="sh"></span></div><div class="timer"><i id="tbar"></i></div>
  <canvas class="mcv" id="dcv" width="${CW}" height="${CH}" role="img" aria-label="5列の道。上から警備ドローンが照準を合わせてくる"></canvas>
  <div class="prow" style="justify-content:space-between"><button class="kbtn" id="dl" type="button" aria-label="左の列へ">◀</button><span class="note">赤い線の列から逃げろ</span><button class="kbtn" id="dr" type="button" aria-label="右の列へ">▶</button></div>`);
  const c=$('#dcv').getContext('2d');c.imageSmoothingEnabled=false;
  let lane=2,vx=lane*LW+LW/2,t=0,last=0,alive=true,shields=P.sh,inv=0,hitFx=0,dodged=0,nextSpawn=1,hz=[];
  offs.push(()=>alive=false);
  const shUp=()=>$('#sh').textContent='シールド '+'◆'.repeat(Math.max(0,shields))+'◇'.repeat(P.sh-Math.max(0,shields));shUp();
  const move=dx=>{if(alive)lane=clamp(lane+dx,0,NL-1)};
  on(window,'keydown',e=>{if(e.repeat)return;if(e.key==='ArrowLeft'||e.key==='a'||e.key==='A'){e.preventDefault();move(-1)}else if(e.key==='ArrowRight'||e.key==='d'||e.key==='D'){e.preventDefault();move(1)}});
  const cvs=$('#dcv');on(cvs,'pointerdown',e=>{e.preventDefault();const r=cvs.getBoundingClientRect();move(e.clientX-r.left<r.width/2?-1:1)});
  on($('#dl'),'pointerdown',e=>{e.preventDefault();move(-1)});on($('#dr'),'pointerdown',e=>{e.preventDefault();move(1)});
  function spawn(){const p=t/DUR,warn=P.w0+(P.w1-P.w0)*p;
    const busy=new Set(hz.filter(h=>t<h.fire+BEAM).map(h=>h.lane));
    let k=1;if(p>0.3&&Math.random()<0.5)k=2;if(p>0.65&&Math.random()<0.4)k=3;k=Math.min(k,NL-2-busy.size);
    for(let i=0;i<k;i++){const free=[...Array(NL).keys()].filter(l=>!busy.has(l));if(!free.length)break;
      const l=i===0&&!busy.has(lane)&&Math.random()<0.6?lane:free[Math.floor(Math.random()*free.length)];
      busy.add(l);hz.push({lane:l,t0:t,fire:t+warn,hit:false})}
    nextSpawn=t+Math.max(0.45,1.05-0.5*p)*(0.85+Math.random()*0.3)}
  function finish(ok){if(!alive)return;alive=false;draw();
    timers.push(setTimeout(()=>jobDone('drone',d,{ok,score:dodged,raw:dodged*4+(ok?60:0),detail:`${ok?'走破':'撃墜'} · 回避 ${dodged} 回 · 残りシールド ${Math.max(0,shields)}`}),700))}
  function step(ts){if(!alive)return;const dt=Math.min(0.05,(ts-last)/1000||0);last=ts;t+=dt;
    if(t>=nextSpawn)spawn();
    for(const h of hz){
      if(t>=h.fire&&t<h.fire+BEAM&&!h.hit&&h.lane===lane){h.hit=true;if(t>=inv){shields--;sfx('hit');inv=t+0.8;hitFx=t+0.15;shUp();if(shields<=0)return finish(false)}}
      if(t>=h.fire+BEAM&&!h.done){h.done=true;if(!h.hit){dodged++;$('#sc').textContent=dodged}}}
    hz=hz.filter(h=>t<h.fire+BEAM+0.4);
    vx+=(lane*LW+LW/2-vx)*Math.min(1,dt*28);
    $('#tbar').style.width=Math.max(0,(1-t/DUR)*100)+'%';
    if(t>=DUR)return finish(true);
    draw();requestAnimationFrame(step)}
  function draw(){
    for(let i=0;i<NL;i++){c.fillStyle=i%2?'#0d0b1a':'#0a0816';c.fillRect(i*LW,0,LW,CH)}
    c.fillStyle='#1d1838';for(let i=1;i<NL;i++)for(let y=(t*90)%14-14;y<CH;y+=14)c.fillRect(i*LW,Math.round(y),1,6);
    for(const h of hz){const cx=h.lane*LW+LW/2;
      if(t<h.fire){const k=(t-h.t0)/(h.fire-h.t0);if(Math.floor(t*(6+k*16))%2===0){c.fillStyle=`rgba(255,74,92,${0.3+0.5*k})`;c.fillRect(cx-1,9,2,CH-9)}}
      else if(t<h.fire+BEAM){c.fillStyle='rgba(255,61,139,.4)';c.fillRect(cx-6,6,12,CH);c.fillStyle='#ffd6ea';c.fillRect(cx-2,6,4,CH)}
      const dy=t<h.fire+BEAM?Math.min(2,-6+(t-h.t0)*30):2-(t-h.fire-BEAM)*40;
      c.drawImage(DRONE,Math.round(cx-4),Math.round(dy))}
    if(t>=inv||Math.floor(t*14)%2){const spr=Math.floor(t*8)%2?P_B:P_A;c.drawImage(spr,Math.round(vx-5),CH-19)}
    if(t<hitFx){c.fillStyle='rgba(255,74,92,.35)';c.fillRect(0,0,CW,CH)}}
  draw();requestAnimationFrame(ts=>{last=ts;requestAnimationFrame(step)})}

/* RAM：パスコード侵入（光った順にキーを押す） */
function runPass(d){const P=jp('pass',d),LAYERS=5;let layer=0,lives=P.lives,raw=0,seq=[],inp=[],phase='wait';
  openPanel(`<div class="hud"><span>RAM · パスコード侵入 · 第 <b id="ly">1</b> / ${LAYERS} 層</span><span id="lv"></span></div>
  <p class="status c" id="st"></p><div class="keypad" id="kp">${[1,2,3,4,5,6,7,8,9].map(k=>`<button type="button" data-k="${k}">${k}</button>`).join('')}</div>
  ${P.review?`<div class="prow" style="justify-content:center"><button class="nbtn ghost" id="rv" type="button" disabled>もう一度見る（残り <b id="rvn">${P.review}</b>）</button></div>`:''}
  <p class="note c">光った順にキーを押す。キーボードの 1〜9 でも入力できます${P.review?'。R で見直し':''}</p>`);
  const kp=$('#kp'),st=$('#st'),key=k=>kp.querySelector(`[data-k="${k}"]`);
  const hudUp=()=>{$('#ly').textContent=Math.min(layer+1,LAYERS);$('#lv').textContent='ミス残り '+'◆'.repeat(lives)+'◇'.repeat(P.lives-lives)};
  let reviews=P.review;const rvUp=()=>{const r=$('#rv');if(r){$('#rvn').textContent=reviews;r.disabled=phase!=='input'||reviews<=0}};
  function play(){seq=[];let p=0;for(let i=0;i<P.len+layer;i++){let k;do k=rnd(1,9);while(k===p);seq.push(k);p=k}show()}
  function show(again){phase='show';inp=[];rvUp();
    kp.querySelectorAll('button').forEach(b=>b.className='');st.textContent=again?'記憶バッファから再生中……':`盗聴中…… ${seq.length} 桁`;
    let at=600;seq.forEach(k=>{timers.push(setTimeout(()=>key(k).classList.add('lit'),at));timers.push(setTimeout(()=>key(k).classList.remove('lit'),at+P.ms));at+=P.ms*1.35});
    timers.push(setTimeout(()=>{phase='input';st.textContent=`入力 0 / ${seq.length}`;rvUp()},at))}
  function press(k){if(phase!=='input')return;const b=key(k);
    if(k===seq[inp.length]){inp.push(k);sfx('key');b.classList.remove('hit');void b.offsetWidth;b.classList.add('hit');timers.push(setTimeout(()=>b.classList.remove('hit'),200));st.textContent=`入力 ${inp.length} / ${seq.length}`;
      if(inp.length===seq.length){phase='wait';rvUp();raw+=6*seq.length;layer++;
        if(layer>=LAYERS){st.textContent='全層突破。アクセス権を奪取';timers.push(setTimeout(()=>finish(true),900))}
        else{st.textContent=`第 ${layer} 層 突破`;timers.push(setTimeout(()=>{hudUp();play()},900))}}}
    else{phase='wait';rvUp();sfx('hit');b.classList.add('bad');key(seq[inp.length]).classList.add('lit');lives--;hudUp();
      if(lives<=0){st.textContent='侵入検知。回線を切断された';timers.push(setTimeout(()=>finish(false),1400))}
      else{st.textContent='コード不一致。次の入力を待つ……';timers.push(setTimeout(play,1400))}}}
  function finish(ok){jobDone('pass',d,{ok,score:layer,raw:raw+(ok?50:0),detail:`突破 ${layer} / ${LAYERS} 層`})}
  const review=()=>{if(phase!=='input'||reviews<=0)return;reviews--;show(true)};
  if($('#rv'))$('#rv').onclick=review;
  kp.onclick=e=>{const b=e.target.closest('button');if(b)press(+b.dataset.k)};
  on(window,'keydown',e=>{if(/^[1-9]$/.test(e.key)){e.preventDefault();if(!e.repeat)press(+e.key)}else if((e.key==='r'||e.key==='R')&&!e.repeat)review()});
  hudUp();play()}

const figURL=(j,h,s)=>sprite(FIG,{h,s,j,p:'#191828',b:'#0b0a12'}).toDataURL();
function runCam(d){const P=jp('cam',d);let found=0,end=performance.now()+P.T*1000,over=false;
  openPanel(`<div class="hud"><span>GPU · 監視カメラ解析 · 特定 <b id="sc">0</b> / ${P.q}</span><span id="tleft">${P.T.toFixed(1)} 秒</span></div><div class="timer"><i id="tbar"></i></div>
  <div class="target">対象の上着<i id="tg"></i></div><div class="feeds" id="fd"></div>
  <p class="note c">同じ色の上着の人物をタップ。間違えると2秒減ります</p>`);
  const fd=$('#fd'),col=(h,s,l)=>`hsl(${Math.round((h+360)%360)},${Math.round(s)}%,${Math.round(l)}%)`;
  function board(){const n=Math.min(5,3+Math.floor(found/4)),delta=Math.max(P.dm,P.d0-found*1.3);
    const h=Math.random()*360,s=55+Math.random()*20,l=42+Math.random()*16,odd=Math.floor(Math.random()*n*n);
    $('#tg').style.background=col(h,s,l);fd.style.gridTemplateColumns=`repeat(${n},1fr)`;
    fd.innerHTML=Array.from({length:n*n},(_,i)=>{let c=col(h,s,l);
      if(i!==odd){const m=(0.6+Math.random()*0.4)*(Math.random()<0.5?-1:1);c=Math.random()<0.5?col(h+m*delta*1.6,s,l):col(h,s,l+m*delta*0.7)}
      return `<button type="button" aria-label="カメラ${i+1}" data-o="${i===odd?1:0}"><img alt="" src="${figURL(c,HAIR[rnd(0,HAIR.length-1)],SKIN[rnd(0,SKIN.length-1)])}"></button>`}).join('');
    if(P.glow){const tb=fd.querySelector('[data-o="1"]');tb.classList.add('glow');timers.push(setTimeout(()=>tb.classList.remove('glow'),P.glow*1000))}}
  fd.onclick=e=>{const b=e.target.closest('button');if(!b||over)return;if(b.dataset.o==='1'){found++;$('#sc').textContent=found;board()}else{end-=2000;sfx('hit');shake(fd)}};
  timeBar(()=>end,P.T,()=>{if(over)return;over=true;const ok=found>=P.q;jobDone('cam',d,{ok,score:found,raw:found*10+(ok?40:0),detail:`特定 ${found} 人 / ノルマ ${P.q} 人`})});board()}

/* ALU：暗号ロック解除（□ に入る数を答える。3問で1錠） */
function runLock(d){const P=jp('lock',d);let tum=0,locks=0,total=0,ans=0,end=performance.now()+P.T*1000,over=false;
  openPanel(`<div class="hud"><span>ALU · 暗号ロック解除 · 解錠 <b id="sc">0</b> / ${P.q}</span><span id="tleft">${P.T.toFixed(1)} 秒</span></div><div class="timer"><i id="tbar"></i></div>
  <div class="tum" id="tm"></div><div class="q" id="q"></div>
  <form id="f" class="prow" style="justify-content:center"><input id="lk-in" class="ans" inputmode="numeric" autocomplete="off" aria-label="□ に入る数"><button class="nbtn">回す</button></form>
  <p class="note c">□ に入る数を答える。タンブラー3つで1錠。間違えると3秒減ります</p>`);
  const tumUp=()=>$('#tm').innerHTML=`LOCK ${String(locks+1).padStart(2,'0')}`+[0,1,2].map(i=>`<i class="${i<tum?'on':''}"></i>`).join('');
  function next(){const s=P.s*(1+total*0.06),k=rnd(0,P.div?3:2);let q;
    if(k===0){const a=rnd(3,Math.round(12*s)),b=rnd(3,Math.round(12*s));if(Math.random()<0.5){q=`□ + ${b} = ${a+b}`;ans=a}else{q=`${a} + □ = ${a+b}`;ans=b}}
    else if(k===1){const c=rnd(10,Math.round(25*s)),b=rnd(2,c-1);q=`${c} − □ = ${c-b}`;ans=b}
    else if(k===2){const a=rnd(2,Math.round(4+2*s)),b=rnd(2,9);q=`${a} × □ = ${a*b}`;ans=b}
    else{const b=rnd(2,9),v=rnd(2,Math.round(3+2*s));q=`□ ÷ ${b} = ${v}`;ans=b*v}
    $('#q').textContent=q}
  const inp=$('#lk-in');
  $('#f').onsubmit=e=>{e.preventDefault();if(over||inp.value.trim()==='')return;
    if(parseInt(inp.value,10)===ans){total++;tum++;if(tum>=3){tum=0;locks++;$('#sc').textContent=locks}tumUp()}else{end-=3000;sfx('hit');shake(inp)}
    inp.value='';next()};
  timeBar(()=>end,P.T,()=>{if(over)return;over=true;const ok=locks>=P.q;jobDone('lock',d,{ok,score:locks,raw:total*8+locks*20+(ok?40:0),detail:`解錠 ${locks} 錠 / ノルマ ${P.q} 錠 · タンブラー ${total} 個`})});
  tumUp();next();inp.focus()}

/* ===== 入力 ===== */
const inField=e=>/INPUT|TEXTAREA|SELECT/.test(e.target.tagName);
addEventListener('keydown',e=>{if(inField(e))return;const k=e.key;
  if(mode==='play'){if(k==='ArrowLeft'||k==='a'||k==='A'){keys.l=true;e.preventDefault()}else if(k==='ArrowRight'||k==='d'||k==='D'){keys.r=true;e.preventDefault()}
    else if(k===' '||k==='Enter'||k==='z'||k==='Z'||k==='ArrowUp'){if(e.target.tagName==='BUTTON'&&e.target.id!=='kA')return;e.preventDefault();if(!e.repeat)interact()}}
  else if(mode==='dialog'){if(k==='ArrowLeft'||k==='ArrowUp'){e.preventDefault();moveSel(-1)}else if(k==='ArrowRight'||k==='ArrowDown'){e.preventDefault();moveSel(1)}
    else if(k===' '||k==='Enter'||k==='z'||k==='Z'){e.preventDefault();if(e.repeat)return;if(D&&!D.typing&&D.lines[D.i].choices)pick(D.sel);else advance()}}
  else if(mode==='title'&&(k==='Enter'||k===' ')&&e.target.tagName!=='BUTTON'){e.preventDefault();startGame()}});
addEventListener('keyup',e=>{const k=e.key;if(k==='ArrowLeft'||k==='a'||k==='A')keys.l=false;if(k==='ArrowRight'||k==='d'||k==='D')keys.r=false});
addEventListener('blur',()=>{keys.l=keys.r=false});
function hold(el,key){const on=e=>{e.preventDefault();keys[key]=true},off=()=>keys[key]=false;el.addEventListener('pointerdown',on);['pointerup','pointerleave','pointercancel'].forEach(t=>el.addEventListener(t,off));el.addEventListener('contextmenu',e=>e.preventDefault())}
hold($('#kL'),'l');hold($('#kR'),'r');
$('#kA').addEventListener('click',()=>{if(mode==='play')interact();else if(mode==='dialog'){if(D&&!D.typing&&D.lines[D.i].choices)pick(D.sel);else advance()}});
cv.addEventListener('pointerdown',()=>{if(mode==='dialog')advance()});

/* ===== タイトル ===== */
function titleButtons(){const has=S.started;$('#titleBtns').innerHTML=(has?'<button class="nbtn" id="cont" type="button">つづきから</button><button class="nbtn ghost" id="newg" type="button">はじめから</button>':'<button class="nbtn" id="newg" type="button">はじめる</button>');
  const c=$('#cont');if(c)c.onclick=startGame;$('#newg').onclick=()=>{if(has){S={...fresh(),snd:S.snd};save();player.x=S.x;hud()}startGame()};($('#cont')||$('#newg')).focus({preventScroll:true})}
function startGame(){sndStart();if(!SND)toast('音のファイル（sound.js）を読み込めなかったため、音なしで動いています',6000);document.activeElement&&document.activeElement.blur();$('#title').hidden=true;mode='play';player.x=S.x;camX=clamp(Math.round(player.x-130),0,CAMMAX);
  if(!S.started){S.started=true;save();talk([L('me','……東京の光が、今夜もあんなに遠い。'),L('me','あの光の中に入るには、脳のスペックがいる。'),L('me','まずは、誰かに話を聞こう。')])}}
setInterval(()=>{if(mode!=='title'){S.x=Math.round(player.x);save()}},3000);

function start(data){if(data&&data.S){S=Object.assign(fresh(),data.S);player.x=S.x}hud();titleButtons();requestAnimationFrame(loop)}
window.claude?.hot?.snapshot?.(()=>({S}));
window.claude?.hot?.ready?window.claude.hot.ready(start):start(window.claude?.hot?.data??{});
})();
</script>
